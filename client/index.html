<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale=1 removed: combined with async React hydration, it is a
      known trigger for Android Chrome computing its initial layout against
      the wrong (legacy "ideal viewport") width before the constraint fully
      applies — the exact failure class behind the Goldline miniature-game
      regression on real Android devices. viewport-fit=cover keeps safe-area
      insets (env(safe-area-inset-*), already used throughout the game CSS)
      working correctly, including in the installed PWA.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Laundry Butler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
