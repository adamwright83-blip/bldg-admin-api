<style>
  :root {
    --paper: #eef0f2;
    --card: #fbfbfa;
    --ink: #0b0f14;
    --ink-2: #4a5160;
    --line: #dcdfe4;
    --amber: #ff8a00;
    --gold: #ffc84d;
    --gold-ink: #9a6400;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.4 Barlow, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .frame { position: fixed; inset: 0; pointer-events: none; border: 10px solid var(--card); border-radius: 0; box-shadow: inset 0 0 0 1px var(--line); }
  .top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 22px); left: 24px; right: 24px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; pointer-events: none; }
  .brand { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px 11px; box-shadow: 0 6px 24px rgba(40, 48, 64, .10); pointer-events: auto; }
  .brand .mark { font: 26px/1 Anton, Impact, sans-serif; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .brand .mark i { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px rgba(255, 138, 0, .18); }
  .brand .sub { font: 600 13px/1.2 "Barlow Condensed", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-top: 4px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; }
  .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font: 600 14px/1 "Barlow Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; box-shadow: 0 4px 16px rgba(40, 48, 64, .08); font-variant-numeric: tabular-nums; }
  .pill b { font-weight: 700; color: var(--ink); }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px 2px rgba(255, 200, 77, .9); }

  .mission { position: fixed; left: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); width: min(360px, calc(100vw - 48px)); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 16px; box-shadow: 0 10px 34px rgba(40, 48, 64, .16); }
  .mission .who { display: flex; align-items: center; gap: 8px; font: 700 12px/1 "Barlow Condensed", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-ink); }
  .mission .who i { width: 8px; height: 8px; transform: rotate(45deg); background: var(--gold); }
  .mission h2 { margin: 8px 0 4px; font: 700 22px/1.1 "Barlow Condensed", sans-serif; text-wrap: balance; }
  .mission p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .mission .meta { display: flex; gap: 14px; margin-top: 10px; font: 600 14px/1 "Barlow Condensed", sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); font-variant-numeric: tabular-nums; }
  .mission .meta span { color: var(--ink-2); font-weight: 500; }
  .mission .row { display: flex; gap: 8px; margin-top: 14px; }
  .btn { appearance: none; border: 0; border-radius: 10px; padding: 10px 14px; font: 700 15px/1 "Barlow Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  .btn.go { background: var(--ink); color: #fff; flex: 1; }

  .btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }

  .pin { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none; display: flex; flex-direction: column; align-items: center; transition: opacity .4s; }
  .pin .tag { background: var(--ink); color: #fff; font: 700 12px/1 "Barlow Condensed", sans-serif; letter-spacing: .14em; text-transform: uppercase; padding: 6px 9px; border-radius: 7px; white-space: nowrap; }
  .pin .stem { width: 2px; height: 26px; background: linear-gradient(var(--ink), rgba(11, 15, 20, 0)); }

  .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 90px); transform: translateX(-50%); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font: 700 16px/1.1 "Barlow Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 10px 30px rgba(40, 48, 64, .18); display: flex; gap: 8px; align-items: center; }
  .toast i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px 3px rgba(255, 200, 77, .9); }
  .hint { position: fixed; right: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); font: 600 12px/1.3 "Barlow Condensed", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #7d8594; text-align: right; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 16px "Barlow Condensed", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); background: var(--paper); }

  @media (max-width: 640px) {
    .top { left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px); }

    .frame { border-width: 6px; }
  }

<script id="district" type="application/json">/*__DISTRICT__*/</script>
<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const D = JSON.parse(document.getElementById('district').textContent);
const T = D.terrain;
const VEX = 1.35;           // vertical exaggeration of the hills, for the diorama read
const HSCALE = 2.1;        // building height scale
const EXT = { x0: T.x0, z0: T.z0, x1: T.x0 + T.cell * (T.nx - 1), z1: T.z0 + T.cell * (T.nz - 1) };
const MARGIN = 1400;        // fog runs past the district edge into the page

// ---------- terrain sampling ----------
function ground(x, z) {
  const fx = Math.min(Math.max((x - T.x0) / T.cell, 0), T.nx - 1.001);
  const fz = Math.min(Math.max((z - T.z0) / T.cell, 0), T.nz - 1.001);
  const ix = Math.floor(fx), iz = Math.floor(fz), tx = fx - ix, tz = fz - iz;
  const h = (i, j) => T.h[j * T.nx + i];
  const a = h(ix, iz) * (1 - tx) + h(ix + 1, iz) * tx;
  const b = h(ix, iz + 1) * (1 - tx) + h(ix + 1, iz + 1) * tx;
  return (a * (1 - tz) + b * tz) * VEX;
}

// ---------- deterministic noise (shared by the reveal field) ----------
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return (a + (b - a) * sx) * (1 - sy) + (c + (d - c) * sx) * sy;
}
function fbm(x, y) { let s = 0, a = .5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return s; }

// ---------- buildings, customers, mission ----------
const B = D.buildings.map((b, i) => {
  let cx = 0, cz = 0; for (const p of b.p) { cx += p[0]; cz += p[1]; }
  cx /= b.p.length; cz /= b.p.length;
  return { ...b, i, cx, cz };
}).filter(b => b.cx > EXT.x0 + 20 && b.cx < EXT.x1 - 20 && b.cz > EXT.z0 + 20 && b.cz < EXT.z1 - 20);

function roadPts(name) { return D.roads.filter(r => r.n === name).flatMap(r => r.p); }
let junction = [0, 0];
{ // Sunset Junction: where Santa Monica Blvd meets Sunset
  const s = roadPts('West Sunset Boulevard'), m = roadPts('Santa Monica Boulevard');
  let best = 1e9; for (const a of s) for (const b of m) { const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (d < best) { best = d; junction = a; } }
}

// Sample customers: real multi-unit buildings near three anchors. (Placeholders for the proof —
// the live version lights the operator's actual customer addresses.)
const anchors = [
  { x: junction[0] + 260, z: junction[1] + 300, n: 3 },   // below Sunset Junction
  { x: 620, z: -420, n: 3 },                               // south end of the reservoir
  { x: -80, z: 430, n: 2 },                                // Sunset near Silver Lake Blvd
];
const footprint = b => { let a = 0; for (let i = 0; i < b.p.length; i++) { const p = b.p[i], q = b.p[(i + 1) % b.p.length]; a += p[0] * q[1] - q[0] * p[1]; } return Math.abs(a) / 2; };
const apt = B.filter(b => b.u >= 8 && (b.t === 'apartments' || b.t === 'residential'));
for (const b of apt) b.score = footprint(b) * b.h;
const customers = [];
for (const a of anchors) {
  const near = apt.filter(b => Math.hypot(b.cx - a.x, b.cz - a.z) < 230).sort((p, q) => q.score - p.score);
  const picked = [];
  for (const b of near) { if (picked.every(p => Math.hypot(p.cx - b.cx, p.cz - b.cz) > 70)) picked.push(b); if (picked.length >= a.n) break; }
  customers.push(...picked);
}
const customerSet = new Set(customers.map(b => b.i));

// the Claire mission: three blocks north of Sunset Junction (north is -z)
const missionAt = { x: junction[0] + 40, z: junction[1] - 270 };
const missionBldgs = B.filter(b => Math.hypot(b.cx - missionAt.x, b.cz - missionAt.z) < 140);
const missionDoors = missionBldgs.reduce((s, b) => s + Math.max(1, b.u), 0);
const missionTarget = missionBldgs.filter(b => b.u >= 4).sort((p, q) => q.u - p.u)[0] || missionBldgs[0];

// ---------- reveal field (signed distance, metres; <0 = charted) ----------
const regions = customers.map(b => ({ x: b.cx, z: b.cz, r: 230 + Math.min(b.u, 60) * 1.2, k: 1 }));
const MW = 256, MH = 256;
const MX0 = EXT.x0 - MARGIN, MZ0 = EXT.z0 - MARGIN, MX1 = EXT.x1 + MARGIN, MZ1 = EXT.z1 + MARGIN;
const warp = new Float32Array(MW * MH);
for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) {
  const x = MX0 + (MX1 - MX0) * i / (MW - 1), z = MZ0 + (MZ1 - MZ0) * j / (MH - 1);
  warp[j * MW + i] = (fbm(x * 0.0065 + 11, z * 0.0065 - 7) - 0.5) * 120;
}
const maskData = new Float32Array(MW * MH);
const maskTex = new THREE.DataTexture(maskData, MW, MH, THREE.RedFormat, THREE.FloatType);
maskTex.magFilter = maskTex.minFilter = THREE.LinearFilter;
function sdAt(x, z) {
  let sd = 1e4; for (const r of regions) sd = Math.min(sd, Math.hypot(x - r.x, z - r.z) - r.r * r.k);
  return sd;
}
function rebuildMask() {
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) {
    const x = MX0 + (MX1 - MX0) * i / (MW - 1), z = MZ0 + (MZ1 - MZ0) * j / (MH - 1);
    let sd = sdAt(x, z) + warp[j * MW + i];
    // the district edge is always fog
    const edge = Math.max(EXT.x0 - x, x - EXT.x1, EXT.z0 - z, z - EXT.z1);
    if (edge > -60) sd = Math.max(sd, edge + 60);
    maskData[j * MW + i] = Math.max(-400, Math.min(900, sd));
  }
  maskTex.needsUpdate = true;
}
function sdField(x, z) { // bilinear read of the mask for CPU-side stats
  const fx = (x - MX0) / (MX1 - MX0) * (MW - 1), fz = (z - MZ0) / (MZ1 - MZ0) * (MH - 1);
  const i = Math.max(0, Math.min(MW - 2, Math.floor(fx))), j = Math.max(0, Math.min(MH - 2, Math.floor(fz)));
  const tx = fx - i, tz = fz - j, m = (a, b) => maskData[b * MW + a];
  return (m(i, j) * (1 - tx) + m(i + 1, j) * tx) * (1 - tz) + (m(i, j + 1) * (1 - tx) + m(i + 1, j + 1) * tx) * tz;
}
rebuildMask();

// ---------- renderer ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const PAPER = new THREE.Color('#e9ecf0');
const scene = new THREE.Scene();
scene.background = PAPER;
scene.fog = new THREE.Fog(PAPER, 3400, 7200);

const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 20, 20000);
const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 450; controls.maxDistance = 5200;
controls.minPolarAngle = 0.35; controls.maxPolarAngle = 1.18;
controls.screenSpacePanning = false;

const SUN = new THREE.Vector3(-0.55, 0.62, -0.56).normalize();  // low evening sun from the north-west

// shared GLSL
const common = /* glsl */`
  uniform sampler2D uMask; uniform vec4 uMaskRect; uniform vec3 uSun; uniform float uTime;
  float sdMask(vec2 xz) { return texture2D(uMask, (xz - uMaskRect.xy) / (uMaskRect.zw - uMaskRect.xy)).r; }
  float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vn(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
    return mix(mix(h21(i), h21(i + vec2(1, 0)), u.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), u.x), u.y); }
  float fbm(vec2 p) { float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * vn(p); p = p * 2.03 + 17.1; a *= .5; } return s; }
`;
const uniforms = {
  uMask: { value: maskTex },
  uMaskRect: { value: new THREE.Vector4(MX0, MZ0, MX1, MZ1) },
  uSun: { value: SUN },
  uTime: { value: 0 },
};
const fogChunk = { fogColor: { value: PAPER }, fogNear: { value: 3400 }, fogFar: { value: 7200 } };

// palette (linear-ish, tuned by eye)
const DUSK_GROUND = '#5b6680', DUSK_BLDG = '#7a86a3', DUSK_ROOF = '#8b95b0';

// ---------- terrain (charted ground at dusk; hidden under fog elsewhere) ----------
{
  const g = new THREE.PlaneGeometry(EXT.x1 - EXT.x0, EXT.z1 - EXT.z0, T.nx - 1, T.nz - 1);
  g.rotateX(-Math.PI / 2);
  g.translate((EXT.x0 + EXT.x1) / 2, 0, (EXT.z0 + EXT.z1) / 2);
  const pos = g.attributes.position;
  for (let k = 0; k < pos.count; k++) pos.setY(k, ground(pos.getX(k), pos.getZ(k)));
  g.computeVertexNormals();
  const m = new THREE.ShaderMaterial({
    uniforms: { ...uniforms, ...fogChunk, uCol: { value: new THREE.Color(DUSK_GROUND) } },
    fog: true,
    vertexShader: /* glsl */`
      varying vec3 vN; varying vec3 vW;
      #include <fog_pars_vertex>
      void main() { vN = normal; vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz;
        vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: common + /* glsl */`
      uniform vec3 uCol; varying vec3 vN; varying vec3 vW;
      #include <fog_pars_fragment>
      void main() {
        float sd = sdMask(vW.xz);
        if (sd > 40.) discard;
        float l = .55 + .45 * max(dot(normalize(vN), uSun), 0.);
        vec3 c = uCol * l * 1.3 * (.9 + .2 * fbm(vW.xz * .02));
        gl_FragColor = vec4(c, 1.);
        #include <fog_fragment>
      }`,
  });
  scene.add(new THREE.Mesh(g, m));
}

// ---------- flat features draped on the ground: roads, parks, water ----------
function clipRing(ring) { // Sutherland–Hodgman against the district rectangle
  const edges = [[p => p[0] >= EXT.x0, (a, b) => EXT.x0, 0], [p => p[0] <= EXT.x1, () => EXT.x1, 0], [p => p[1] >= EXT.z0, () => EXT.z0, 1], [p => p[1] <= EXT.z1, () => EXT.z1, 1]];
  let out = ring;
  for (const [inside, val, ax] of edges) {
    const src = out; out = [];
    for (let i = 0; i < src.length; i++) {
      const a = src[i], b = src[(i + 1) % src.length];
      const ia = inside(a), ib = inside(b);
      if (ia) out.push(a);
      if (ia !== ib) { const v = val(); const t = (v - a[ax]) / (b[ax] - a[ax]); out.push(ax === 0 ? [v, a[1] + t * (b[1] - a[1])] : [a[0] + t * (b[0] - a[0]), v]); }
    }
    if (!out.length) break;
  }
  return out;
}
function drapeShape(rings, lift) {
  const pos = [], idx = [];
  for (const raw of rings) {
    const ring = clipRing(raw); if (ring.length < 3) continue;
    const v2 = ring.map(p => new THREE.Vector2(p[0], p[1]));
    const tris = THREE.ShapeUtils.triangulateShape(v2, []);
    const base = pos.length / 3;
    for (const p of ring) pos.push(p[0], 0, p[1]);
    for (const t of tris) idx.push(base + t[0], base + t[1], base + t[2]);
  }
  return { pos, idx };
}
function flatMaterial(frag, extraUniforms = {}) {
  return new THREE.ShaderMaterial({
    uniforms: { ...uniforms, ...fogChunk, ...extraUniforms }, fog: true,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    vertexShader: /* glsl */`
      varying vec3 vW; attribute float aAlong;  varying float vAlong;
      #include <fog_pars_vertex>
      void main() { vAlong = aAlong; vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz;
        vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: common + /* glsl */`varying vec3 vW; varying float vAlong;
      #include <fog_pars_fragment>
      ` + frag,
  });
}
// water sits flat at the lowest ground its outline touches
{
  const pos = [], idx = [];
  for (const w of D.water) {
    const ring = clipRing(w.p); if (ring.length < 3) continue;
    let lo = 1e9; for (const p of ring) lo = Math.min(lo, ground(p[0], p[1]));
    const tris = THREE.ShapeUtils.triangulateShape(ring.map(p => new THREE.Vector2(p[0], p[1])), []);
    const base = pos.length / 3;
    for (const p of ring) pos.push(p[0], lo - 1.5, p[1]);
    for (const t of tris) idx.push(base + t[0], base + t[1], base + t[2]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aAlong', new THREE.Float32BufferAttribute(new Float32Array(pos.length / 3), 1));
  g.setIndex(idx);
  const m = flatMaterial(/* glsl */`
    void main() {
      float sd = sdMask(vW.xz); if (sd > 40.) discard;
      vec3 deep = vec3(.05, .11, .20), sky = vec3(.30, .40, .56);
      float ripple = fbm(vW.xz * .045 + vec2(uTime * .05, -uTime * .03));
      vec3 c = mix(deep, sky, .25 + .5 * ripple);

stats();
let nearest = 1e9; for (const b of customers) nearest = Math.min(nearest, Math.hypot(b.cx - missionAt.x, b.cz - missionAt.z));
$('mTitle').textContent = 'Uncharted: 3 blocks north of Sunset Junction';
$('mBody').textContent = 'Nobody has knocked here yet. Win one building and the whole block comes out of the fog.';
$('mDoors').textContent = '~' + Math.round(missionDoors / 5) * 5;
$('mBldg').textContent = missionBldgs.length;
$('mDist').textContent = (nearest / 1609).toFixed(1) + ' mi';
$('pinTag').textContent = 'Uncharted · ~' + Math.round(missionDoors / 5) * 5 + ' doors';
$('mission').hidden = false; $('pin').hidden = false;

let reveal = null;
$('flyBtn').onclick = () => flyTo(missionAt, 1500);
$('winBtn').onclick = () => {
  $('winBtn').disabled = true;
  flyTo(missionAt, 1400, 1.2);
  setTimeout(() => {
    const b = missionTarget;
    customers.push(b); customerSet.add(b.i);
    scene.remove(cityMesh); cityMesh.geometry.dispose();
    cityMesh = buildBuildings(B.filter(x => !customerSet.has(x.i)), false); scene.add(cityMesh);
    const L = addLantern(b, 0);
    const reg = { x: b.cx, z: b.cz, r: 230, k: 0 };
    regions.push(reg);
    reveal = { t: 0, reg, L };
    $('pin').hidden = true; ring.visible = false;
  }, 1300);
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  tilt.uniforms.uRes.value.set(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  uniforms.uTime.value = t;
  if (fly) {
    fly.t += dt / fly.dur; const e = fly.t >= 1 ? 1 : 1 - Math.pow(1 - fly.t, 3);
    controls.target.lerpVectors(fly.fromT, fly.toT, e); camera.position.lerpVectors(fly.fromP, fly.toP, e);
    if (fly.t >= 1) fly = null;
  }
  if (reveal) {
    reveal.t += dt / 2.8; const e = Math.min(1, reveal.t), k = 1 - Math.pow(1 - e, 3);
    reveal.reg.k = k; rebuildMask();
    reveal.L.halo.material.uniforms.uA.value = k;
    reveal.L.mesh.material.uniforms.uLit.value = Math.min(1, e * 2.2);
    if (e >= 1) {
      reveal = null; stats();
      $('toastText').textContent = 'New lantern · the block is yours'; $('toast').hidden = false;
      setTimeout(() => { $('toast').hidden = true; }, 3200);
      $('mission').hidden = true;
    }
  }
  ring.scale.setScalar(1 + 0.25 * Math.sin(t * 2.2)); ring.material.opacity = 0.65 + 0.35 * Math.sin(t * 2.2);
  controls.update();
  // project the mission tag
  tmp.set(missionAt.x, pinY + 10, missionAt.z).project(camera);
  const pin = $('pin');
  if (!pin.hidden) { pin.style.left = ((tmp.x + 1) / 2 * innerWidth) + 'px'; pin.style.top = ((1 - tmp.y) / 2 * innerHeight) + 'px'; pin.style.opacity = tmp.z < 1 ? 1 : 0; }
  composer.render();
  requestAnimationFrame(tick);
}
$('loading').remove();
tick();
window.__lantern = { customers, junction, missionAt, missionDoors, renderer, camera, controls, frame, flyTo };
</script>
