<title>Lantern City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root { --paper: #eef0f2; --card: #fbfbfa; --ink: #0b0f14; --ink2: #4a5160; --line: #dcdfe4; --amber: #ff8a00; --gold: #ffc84d; --goldInk: #9a6400; color-scheme: light; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.4 Barlow, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  .frame { position: fixed; inset: 0; pointer-events: none; border: 10px solid var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 22px); left: 24px; right: 24px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; pointer-events: none; }
  .brand { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px 11px; box-shadow: 0 6px 24px rgba(40,48,64,.1); }
  .mark { font: 26px/1 Anton, Impact, sans-serif; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .mark i { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px rgba(255,138,0,.18); }
  .sub { font: 600 13px/1.2 "Barlow Condensed", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); margin-top: 4px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font: 600 14px/1 "Barlow Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; box-shadow: 0 4px 16px rgba(40,48,64,.08); font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px 2px rgba(255,200,77,.9); }
  .fogDot { width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 1px solid #c9ced6; }
  .card { position: fixed; left: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); width: min(360px, calc(100% - 48px)); box-sizing: border-box; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 16px; box-shadow: 0 10px 34px rgba(40,48,64,.16); }
  .who { display: flex; align-items: center; gap: 8px; font: 700 12px/1 "Barlow Condensed", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--goldInk); }
  .who i { width: 8px; height: 8px; transform: rotate(45deg); background: var(--gold); }
  .card h2 { margin: 8px 0 4px; font: 700 22px/1.1 "Barlow Condensed", sans-serif; text-wrap: balance; }
  .card p { margin: 0; color: var(--ink2); font-size: 14px; }
  .meta { display: flex; gap: 16px; margin-top: 10px; font: 600 14px/1 "Barlow Condensed", sans-serif; letter-spacing: .05em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .meta span { color: var(--ink2); font-weight: 500; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .go, .ghost { appearance: none; border: 0; border-radius: 10px; padding: 10px 14px; font: 700 15px/1 "Barlow Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  .go { background: var(--ink); color: #fff; flex: 1; }
  .ghost { background: transparent; color: var(--ink2); border: 1px solid var(--line); }
  .sample { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 24px); transform: translateX(-50%); background: #fff3d6; border: 1px solid #f1d39a; color: #7a5200; border-radius: 999px; padding: 6px 12px; font: 700 12px/1 "Barlow Condensed", sans-serif; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .hint { position: fixed; right: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); font: 600 12px/1.3 "Barlow Condensed", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #7d8594; text-align: right; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 16px "Barlow Condensed", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); background: var(--paper); padding: 0 24px; text-align: center; }
  @media (max-width: 640px) {
    .top { left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px); }
    .mark { font-size: 21px; }
    .wide { display: none; }
    .card { left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: calc(100% - 32px); }
    .hint { display: none; }
    .sample { top: calc(env(safe-area-inset-top, 0px) + 128px); }
    .frame { border-width: 6px; }
  }
</style>

<div id="stage" aria-label="Lantern City map"></div>
<div class="frame" aria-hidden="true"></div>
<header class="top">
  <div class="brand"><div class="mark"><i></i>JOYSTICK</div><div class="sub">Lantern City</div></div>
  <div class="stats" id="stats" hidden>
    <div class="pill"><span class="dot"></span><b id="nL">0</b>&nbsp;lanterns</div>
    <div class="pill"><span class="fogDot"></span><b id="nC">0%</b>&nbsp;charted</div>
    <div class="pill wide"><b id="nD">0</b>&nbsp;doors in your light</div>
  </div>
</header>
<div class="sample">Sample lanterns · not your customers</div>
<section class="card" id="mission" hidden aria-label="Uncharted land">
  <div class="who"><i></i><span id="mKind">Uncharted</span></div>
  <h2 id="mTitle"></h2>
  <p id="mBody"></p>
  <div class="meta"><div><b id="mDoors"></b> <span>doors to win</span></div><div id="mDistWrap"><b id="mDist"></b> <span>from your light</span></div></div>
  <div class="row"><button class="go" id="mGo" type="button">Show me</button></div>
</section>
<section class="card" id="lantern" hidden aria-label="Lantern">
  <div class="who"><i></i>Lantern</div>
  <h2 id="lTitle"></h2>
  <p id="lBody"></p>
  <div class="row"><button class="ghost" id="lClose" type="button">Close</button></div>
</section>
<div class="hint">Drag to pan · pinch or scroll to zoom · tap a lantern<br>Map data © OpenStreetMap contributors · Neighbourhoods: Mapping L.A.</div>
<div id="loading">Lifting the fog…</div>
<script type="module" src="app.js"></script>
