<script type="module">

function grade(img,c1,c2,x2=1,y2=.7,desat=0,ov=null){const c=document.createElement("canvas");c.width=img.width;c.height=img.height;const x=c.getContext("2d");x.drawImage(img,0,0);
  if(desat){const d=x.getImageData(0,0,c.width,c.height),a=d.data;for(let i=0;i<a.length;i+=4){const l=a[i]*.3+a[i+1]*.59+a[i+2]*.11;a[i]=lerp(a[i],l,desat);a[i+1]=lerp(a[i+1],l,desat);a[i+2]=lerp(a[i+2],l,desat)}x.putImageData(d,0,0)}

const DEP=(()=>{const c=document.createElement("canvas");c.width=420;c.height=236;const x=c.getContext("2d"),w=c.width,h=c.height;
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,"#0a0a0a");g.addColorStop(.25,"#1a1a1a");g.addColorStop(.26,"#6e6e6e");g.addColorStop(.76,"#707070");g.addColorStop(.77,"#909090");g.addColorStop(1,"#e4e4e4");x.fillStyle=g;x.fillRect(0,0,w,h);
  const poly=(v,p)=>{x.fillStyle=`rgb(${v},${v},${v})`;x.beginPath();p.forEach(([a,b],i)=>i?x.lineTo(a*w,b*h):x.moveTo(a*w,b*h));x.closePath();x.fill()};
  poly(0,[[.24,0],[.51,0],[.51,.25],[.24,.25]]);              // window, far
  poly(130,[[.26,.37],[.73,.37],[.73,.58],[.26,.58]]);        // shelf and Pip's bed
  poly(120,[[.78,0],[1,0],[1,.72],[.78,.72]]);                // the open lid
  poly(196,[[.9,.43],[1,.43],[1,.83],[.9,.83]]);              // the tall tin
  poly(205,[[.86,.74],[1,.72],[1,1],[.86,1]]);                // the side wall it stands on
  poly(170,[[0,.18],[.2,.22],[.2,.78],[0,.8]]);               // left wall and lamp
  poly(200,[[0,.57],[.3,.6],[.3,.9],[0,.9]]);                 // sleeping bag and spool
  x.filter="blur(6px)";x.drawImage(c,0,0);x.filter="none";
  const d=x.getImageData(0,0,w,h).data;c.sample=(px,py)=>{const i=(clamp(Math.round(py/IH*h),0,h-1)*w+clamp(Math.round(px/IW*w),0,w-1))*4;return d[i]/255};return c})();
/* ---------- plate shader ---------- */
const VS=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;v.y=1.-v.y;gl_Position=vec4(p,0.,1.);}`;
