<script type="module">

function grade(img,c1,c2,x2=1,y2=.7,desat=0,ov=null){const c=document.createElement("canvas");c.width=img.width;c.height=img.height;const x=c.getContext("2d");x.drawImage(img,0,0);

  x.globalCompositeOperation="multiply";const g=x.createLinearGradient(0,0,c.width*x2,c.height*y2);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,c.width,c.height);

  const yb=s.height*.5,n=9;x.moveTo(0,top?0:s.height);x.lineTo(0,yb);for(let i=1;i<=n;i++)x.lineTo(s.width*i/n,yb+(i%2?-1:1)*s.height*.045);x.lineTo(s.width,top?0:s.height);x.closePath();x.clip();x.drawImage(s,0,0);

let W=0,H=0;const DPR=Math.min(devicePixelRatio||1,2);

/* ---------- depth map (0 far … 1 near), hand-painted for this plate ---------- */
const DEP=(()=>{const c=document.createElement("canvas");c.width=420;c.height=236;const x=c.getContext("2d"),w=c.width,h=c.height;
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,"#000");g.addColorStop(.34,"#1c1c1c");g.addColorStop(.62,"#6a6a6a");g.addColorStop(.86,"#a4a4a4");g.addColorStop(1,"#dcdcdc");x.fillStyle=g;x.fillRect(0,0,w,h);
  const poly=(v,p)=>{x.fillStyle=`rgb(${v},${v},${v})`;x.beginPath();p.forEach(([a,b],i)=>i?x.lineTo(a*w,b*h):x.moveTo(a*w,b*h));x.closePath();x.fill()};
  poly(0,[[.26,0],[.55,0],[.55,.30],[.26,.30]]);              // window, far

  poly(150,[[.17,.6],[.62,.6],[.62,.81],[.17,.81]]);          // bed, matchboxes, spool
