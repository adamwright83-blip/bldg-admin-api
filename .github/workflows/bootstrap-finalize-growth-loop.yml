name: Bootstrap finalize Goldline growth loop
on:
  push:
    branches: [feature/goldline-growth-loop-hardening]
    paths: [.github/workflows/bootstrap-finalize-growth-loop.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: growth_loop_gate
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/growth_loop_gate
      DAYFORGE_RELEASE_DB: "1"
      APP_SHARED_API_SECRET: growth-loop-app-secret-000000000000000000
      JWT_SECRET: growth-loop-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: growth-loop-placeholder-not-used
      DRIVER_PASSWORD: growth-loop-driver-pass
      DRIVER_OPEN_ID: growth-loop-driver
    steps:
      - uses: actions/checkout@v7
        with: { ref: feature/goldline-growth-loop-hardening }
      - uses: pnpm/action-setup@v6
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format touched source and test files
        run: >-
          pnpm exec prettier --write
          client/src/game/GoldlineGameHome.tsx
          client/src/game/goldline-game.css
          client/src/game/session/useVisualViewportSize.ts
          client/src/pages/GoldlineEffectivenessAdmin.tsx
          client/src/pages/SalesIntelAdmin.tsx
          client/src/pages/SalesIntelAdmin.review-contract.test.ts
          server/dayforgeEvents/goldlineEffectivenessQueries.ts
          server/salesIntel/armoryDoctrineGate.integration.test.ts
          server/salesIntel/salesIntelStore.ts
          shared/dayforgeEvents.ts
          shared/goldlineAnalyticsClosure.test.ts
          playwright.goldline.config.ts
          e2e/goldline/pixel9Layout.spec.ts
      - run: pnpm db:dayforge:release
      - name: Focused unit gates
        run: >-
          pnpm vitest run
          shared/goldlineAnalyticsClosure.test.ts
          client/src/pages/SalesIntelAdmin.review-contract.test.ts
      - name: Armory doctrine DB gate
        run: >-
          pnpm vitest run --config vitest.integration.config.ts
          server/salesIntel/armoryDoctrineGate.integration.test.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.goldline.config.ts
      - run: node scripts/checkGoldlineBundleBudget.mjs
      - run: git diff --check
      - name: Commit formatting cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/game/GoldlineGameHome.tsx client/src/game/goldline-game.css client/src/game/session/useVisualViewportSize.ts client/src/pages/GoldlineEffectivenessAdmin.tsx client/src/pages/SalesIntelAdmin.tsx client/src/pages/SalesIntelAdmin.review-contract.test.ts server/dayforgeEvents/goldlineEffectivenessQueries.ts server/salesIntel/armoryDoctrineGate.integration.test.ts server/salesIntel/salesIntelStore.ts shared/dayforgeEvents.ts shared/goldlineAnalyticsClosure.test.ts playwright.goldline.config.ts e2e/goldline/pixel9Layout.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
          else
            git commit -m "chore: format Goldline growth-loop hardening"
            git push origin HEAD:feature/goldline-growth-loop-hardening
          fi
