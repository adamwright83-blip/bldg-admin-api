name: Patch Real Workday follow-up truth

on:
  push:
    branches:
      - cursor/goldline-real-workday-followups

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/goldline-real-workday-followups
          fetch-depth: 1
      - name: Apply guarded follow-up truth patch
        run: node scripts/patchRealWorkdayFollowUpTruth.cjs
      - name: Commit source patch and remove scaffolding
        run: |
          rm .github/workflows/patch-real-workday-followups.yml
          rm scripts/patchRealWorkdayFollowUpTruth.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/commercialPipeline/commercialPipelineService.ts server/dayforgeToday/dayforgeTodayRouter.ts server/commercialPipeline/realWorkdayFollowUpTruth.test.ts client/src/game/actions/actionServices.ts client/src/game/actions/GoldlineActionSurface.tsx client/src/pages/driver/GoldlineDriverController.tsx .github/workflows/patch-real-workday-followups.yml scripts/patchRealWorkdayFollowUpTruth.cjs
          git commit -m "feat(real-workday): record truthful follow-up outcomes"
          git push origin HEAD:cursor/goldline-real-workday-followups
