name: Claire sales truth
on:
  # Run by ci.yml when a change needs it (scripts/ci/ciAreas.mjs), nightly, and by hand.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonical money, source completeness, customer knowledge and artifacts
        run: >-
          pnpm vitest run
          server/analytics
          server/integrations/cleancloud
          server/geography/customerOrderTruth.test.ts
          server/claire/businessConversation.test.ts
          server/claire/claireOralExam.test.ts
          server/claire/proactive/salesInsights.test.ts
      - run: node --check scripts/migrate.mjs
