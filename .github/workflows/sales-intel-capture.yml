name: Sales Intel capture gates

on:
  pull_request:
    paths:
      - "client/public/goldline.webmanifest"
      - "client/src/components/driver/**"
      - "client/src/pages/Driver.tsx"
      - "client/src/pages/driver/GoldlineDriverCaptureShell.tsx"
      - "server/_core/systemRouter.ts"
      - "server/salesIntel/**"
      - "shared/instagramShareCapture*"
      - "shared/salesIntel*"
      - "drizzle/**"
      - ".github/workflows/sales-intel-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-intel-capture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sales_intel_capture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/sales_intel_capture
      DAYFORGE_RELEASE_DB: "1"
      APP_SHARED_API_SECRET: sales-intel-capture-app-secret-000000000000000000
      JWT_SECRET: sales-intel-capture-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: sales-intel-capture-placeholder-not-used

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run phone capture unit contracts
        run: >-
          pnpm vitest run
          shared/instagramShareCapture.test.ts
          server/salesIntel/instagramMediaResolver.test.ts
          server/salesIntel/geminiUploadedMediaUnderstanding.test.ts
          server/salesIntel/instagramCaptureService.test.ts
          server/salesIntel/salesIntelCaptureAuthorization.test.ts
          server/salesIntel/salesIntelTeachingExtraction.test.ts

      - name: Guard the known TypeScript baseline
        shell: bash
        run: |
          set +e
          pnpm exec tsc --noEmit -p . --pretty false > /tmp/sales-intel-tsc.log 2>&1
          tsc_status=$?
          set -e
          if [ "$tsc_status" -eq 0 ]; then
            echo "TypeScript: 0 errors"
            exit 0
          fi
          error_count=$(grep -c "error TS" /tmp/sales-intel-tsc.log || true)
          echo "TypeScript errors: ${error_count}; current known repository baseline ceiling: 42"
          if [ "$error_count" -gt 42 ]; then
            cat /tmp/sales-intel-tsc.log
            echo "New TypeScript errors exceed the established main-branch baseline."
            exit 1
          fi

      - name: Apply repository migrations to disposable MySQL
        run: pnpm db:dayforge:release

      - name: Prove generalized teaching review/idempotency against MySQL
        run: >-
          pnpm vitest run --config vitest.integration.config.ts
          server/salesIntel/salesIntelTeachingReExtraction.integration.test.ts

      - name: Build production bundles
        run: pnpm build

      - name: Enforce Goldline runtime budget
        run: node scripts/checkGoldlineBundleBudget.mjs
