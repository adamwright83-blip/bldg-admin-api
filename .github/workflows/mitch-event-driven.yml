name: Mitch event-driven producer

on:
  pull_request:
    paths:
      - "server/mitch/**"
      - "shared/mitch*.ts"
      - "drizzle/0111_mitch_producer_events.sql"
      - "scripts/migrate.mjs"
      - ".github/workflows/mitch-event-driven.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mitch-event-driven-${{ github.ref }}
  cancel-in-progress: true

jobs:
  producer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mitch_test
        ports:
          - 3414:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mitch unit and HTTP contracts
        run: pnpm vitest run server/mitch
      - name: Mitch typecheck
        run: pnpm exec tsc --noEmit --incremental false
      - name: Durable inbox against disposable MySQL
        env:
          MITCH_EVENT_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3414/mitch_test
        run: >-
          pnpm vitest run --config vitest.integration.config.ts
          server/mitch/mitchEventInbox.mysql.integration.test.ts
