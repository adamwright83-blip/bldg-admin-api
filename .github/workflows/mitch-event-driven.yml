name: Mitch event-driven producer

on:
  # Run by ci.yml when a change needs it (scripts/ci/ciAreas.mjs), nightly, and by hand.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mitch_test
        ports:
          - 3414:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mitch unit and HTTP contracts
        run: pnpm vitest run server/mitch
      # ci.yml type-checks every code change once, in its typecheck job.
      - name: Mitch autonomous agent typecheck
        run: pnpm exec tsc --project tsconfig.mitch-agent.json --noEmit
      - name: Durable inbox against disposable MySQL
        env:
          MITCH_EVENT_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3414/mitch_test
        run: >-
          pnpm vitest run --config vitest.integration.config.ts
          server/mitch/mitchEventInbox.mysql.integration.test.ts
      - name: Install Chromium for Kingdom Two proof
        run: pnpm exec playwright install --with-deps chromium
      - name: Kingdom Two mobile gameplay proof
        run: pnpm exec playwright test --config e2e/boreslay/playwright.config.ts
