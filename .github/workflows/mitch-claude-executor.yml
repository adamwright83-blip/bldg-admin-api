name: Mitch Claude executor

on:
  workflow_dispatch:
    inputs:
      wake:
        description: Signed-by-control-plane Mitch wake envelope
        required: true
        type: string

permissions:
  contents: write
  issues: read
  id-token: write

concurrency:
  group: mitch-executor-${{ github.event.inputs.wake }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Execute bounded Mitch work order
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MITCH_AGENT_ROLE: executor
          MITCH_WAKE: ${{ inputs.wake }}
          MITCH_GITHUB_REPO: adamwright83-blip/bldg-admin-api
          MITCH_GITHUB_ISSUE_NUMBER: "370"
          MITCH_PRODUCER_BASE_URL: ${{ fromJSON(inputs.wake).controlPlaneBaseUrl }}
          MITCH_CLAUDE_MODEL: claude-sonnet-4-6
        run: pnpm exec tsx scripts/mitch-github-agent.ts
