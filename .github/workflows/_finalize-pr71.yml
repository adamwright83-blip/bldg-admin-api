name: Finalize PR71

on:
  push:
    branches:
      - agent/goldline-objective-agnostic-expedition
    paths:
      - ".github/workflows/_finalize-pr71.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/goldline-objective-agnostic-expedition
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align PWA contract to canonical driver root
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/goldline/expandableWorld.spec.ts')
          s = p.read_text()
          s = s.replace('test.describe("PWA scope stays driver-only", () => {', 'test.describe("PWA uses the canonical driver root", () => {')
          s = s.replace('test("manifest keeps /driver as start_url and scope", async ({ page }) => {', 'test("manifest starts and scopes at the driver host root", async ({ page }) => {')
          s = s.replace('    expect(manifest.start_url).toContain("/driver");\n    expect(manifest.scope).toContain("/driver");\n    // The admin surface must never be captured by the driver PWA.\n    expect(manifest.scope).not.toBe("/");', '    expect(manifest.start_url).toBe("/");\n    expect(manifest.scope).toBe("/");')
          p.write_text(s)
          PY
      - name: Verify focused unit tests
        run: pnpm vitest run client/src/game/expedition
      - name: Verify production build and bundle budget
        run: |
          VITE_GOLDLINE_TEST_HARNESS=1 pnpm build
          node scripts/checkGoldlineBundleBudget.mjs
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/_finalize-pr71.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/goldline/expandableWorld.spec.ts client/public/goldline.webmanifest client/public/goldline-sw.js e2e/goldline/realDayIgnition.spec.ts .github/workflows/_finalize-pr71.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Goldline: finalize objective-agnostic shell and root URL"
          git push origin HEAD:agent/goldline-objective-agnostic-expedition
