name: Bootstrap Pixel Goldline gate
on:
  push:
    branches: [feature/goldline-growth-loop-hardening]
    paths: [.github/workflows/bootstrap-pixel-gate.yml]
permissions:
  contents: write
jobs:
  pixel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: pixel_gate }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/pixel_gate
      DAYFORGE_RELEASE_DB: "1"
      APP_SHARED_API_SECRET: pixel-app-secret-000000000000000000
      JWT_SECRET: pixel-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: pixel-placeholder-not-used
      DRIVER_PASSWORD: pixel-driver-pass
      DRIVER_OPEN_ID: pixel-driver
    steps:
      - uses: actions/checkout@v7
        with: { ref: feature/goldline-growth-loop-hardening }
      - uses: pnpm/action-setup@v6
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Add stable layout probes and Pixel browser proof
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('client/src/game/GoldlineGameHome.tsx'); s=p.read_text()
          s=s.replace('<main className="playable-goldline-shell" ref={setShellEl}>','<main className="playable-goldline-shell" ref={setShellEl} data-testid="goldline-shell">',1)
          s=s.replace('<section className={`playable-goldline is-${view}`} aria-label="Goldline playable field world">','<section className={`playable-goldline is-${view}`} aria-label="Goldline playable field world" data-testid="goldline-world">',1)
          s=s.replace('className={`game-joystick${props.disabled ? " is-disabled" : ""}`}','className={`game-joystick${props.disabled ? " is-disabled" : ""}`}\n      data-testid="goldline-joystick"',1)
          p.write_text(s)
          Path('playwright.goldline.config.ts').write_text('''import { defineConfig } from "@playwright/test";\nconst baseURL="http://127.0.0.1:4174";\nexport default defineConfig({testDir:"./e2e/goldline",fullyParallel:false,workers:1,retries:0,reporter:"list",use:{baseURL,trace:"retain-on-failure",screenshot:"only-on-failure"},webServer:{command:"NODE_ENV=ci PORT=4174 node dist/index.js",url:`${baseURL}/driver`,reuseExistingServer:false,timeout:120000,env:{...process.env,NODE_ENV:"ci",PORT:"4174"}}});\n''')
          Path('e2e/goldline').mkdir(parents=True,exist_ok=True)
          Path('e2e/goldline/pixel9Layout.spec.ts').write_text('''import { test, expect } from "@playwright/test";\nconst PORTRAIT={width:412,height:923},LANDSCAPE={width:923,height:412};\nasync function login(page:any){const response=await page.request.post("/api/auth/login",{data:{password:"pixel-driver-pass",role:"driver"}});expect(response.ok()).toBeTruthy();await page.goto("/driver");await expect(page.getByTestId("goldline-shell")).toBeVisible({timeout:30000});}\nasync function assertLayout(page:any,size:{width:number;height:number}){await page.setViewportSize(size);await page.waitForTimeout(250);const shell=page.getByTestId("goldline-shell"),world=page.getByTestId("goldline-world"),joystick=page.getByTestId("goldline-joystick");const [sb,wb,jb]=await Promise.all([shell.boundingBox(),world.boundingBox(),joystick.boundingBox()]);expect(sb).not.toBeNull();expect(wb).not.toBeNull();expect(jb).not.toBeNull();expect(sb!.width).toBeGreaterThanOrEqual(size.width*.94);expect(sb!.height).toBeGreaterThanOrEqual(size.height*.80);expect(wb!.width).toBeGreaterThanOrEqual(size.width*.90);expect(wb!.height).toBeGreaterThanOrEqual(size.height*.72);expect(jb!.width).toBeGreaterThanOrEqual(44);expect(jb!.height).toBeGreaterThanOrEqual(44);const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);expect(overflow).toBeLessThanOrEqual(2);}\ntest("Pixel 9 Pro portrait and landscape never collapse Goldline into a tiny centered rectangle",async({page})=>{await page.setViewportSize(PORTRAIT);await login(page);await assertLayout(page,PORTRAIT);await assertLayout(page,LANDSCAPE);await assertLayout(page,PORTRAIT);});\n''')
          PY
      - run: pnpm db:dayforge:release
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.goldline.config.ts
      - run: node scripts/checkGoldlineBundleBudget.mjs
      - run: git diff --check
      - name: Commit Pixel gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/game/GoldlineGameHome.tsx playwright.goldline.config.ts e2e/goldline/pixel9Layout.spec.ts
          git commit -m "goldline: add Pixel 9 layout regression proof"
          git push origin HEAD:feature/goldline-growth-loop-hardening
