name: DayForge mission foundation

on:
  pull_request:
    paths:
      - "client/src/pages/TerritoryPreview.tsx"
      - "client/src/pages/CommercialSalesMission.tsx"
      - "client/src/pages/CommercialProposalPrint.tsx"
      - "client/src/pages/territory-preview.css"
      - "client/src/pages/commercial-sales-mission.css"
      - "client/src/pages/commercial-proposal-print.css"
      - "client/src/components/boreslay-rally/*Mission*.ts"
      - "shared/commercialMission*.ts"
      - "shared/commercialProposal*.ts"
      - "server/territory/**"
      - "server/commercialMissions/**"
      - "server/churnRadar/**"
      - "server/_core/systemRouter.ts"
      - "client/src/App.tsx"
      - "tsconfig.dayforge.json"
      - ".github/workflows/dayforge-foundation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: DayForge focused typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc -p tsconfig.dayforge.json 2>&1 | tee dayforge-typecheck.log

      - name: Existing repository typecheck baseline
        id: repository_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee repository-typecheck-baseline.log

      - name: DayForge foundation tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm vitest run \
            shared/commercialMission.test.ts \
            shared/commercialMissionLifecycle.test.ts \
            shared/commercialProposal.test.ts \
            server/territory/scoreLaundryOpportunity.test.ts \
            server/commercialMissions/opsTaskCommercialMissionStore.test.ts \
            server/churnRadar/scoreCustomerChurn.test.ts \
            server/churnRadar/buildWinBackDraft.test.ts \
            client/src/components/boreslay-rally/ProductionBoreslayMissionAdapter.test.ts \
            client/src/components/boreslay-rally/TrpcBoreslayMissionTransport.test.ts \
            2>&1 | tee dayforge-tests.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee dayforge-build.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dayforge-validation-${{ github.run_number }}
          path: |
            dayforge-typecheck.log
            repository-typecheck-baseline.log
            dayforge-tests.log
            dayforge-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce DayForge validation result
        if: always()
        shell: bash
        run: |
          echo "dayforge_typecheck=${{ steps.typecheck.outcome }}"
          echo "repository_baseline=${{ steps.repository_typecheck.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
