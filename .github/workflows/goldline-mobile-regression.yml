name: Goldline mobile regression

on:
  pull_request:
    paths:
      - "client/src/game/**"
      - "client/src/pages/driver/GoldlineDriverController.tsx"
      - "client/src/pages/Driver.tsx"
      - "client/src/pages/goldline/**"
      - "client/src/components/driver/**"
      - "client/src/components/admin/control-room/**"
      - "server/commercialMissions/driverSalesMotivationService.ts"
      - "server/commercialMissions/driverSalesJournalResilience.test.ts"
      - "server/driverGameWorld/**"
      - "server/capabilities/expansionScoutCapability.ts"
      - "server/armory/armoryWeaponService.ts"
      - "server/armory/armoryRouter.ts"
      - "server/armory/armoryEvolution.integration.test.ts"
      - "server/salesIntel/driverSafeSalesIntel*"
      - "server/field/**"
      - "server/goldlineWorld/**"
      - "server/legacyDayforgeRelease/legacyDayforgeReleaseJourney.integration.test.ts"
      - "server/openChannel/**"
      - "server/impactSignals/**"
      - "shared/localTargetRun.ts"
      - "shared/localTargetRun.test.ts"
      - "shared/impactSignal.ts"
      - "shared/impactSignal.test.ts"
      - "shared/goldlineProgression.ts"
      - "shared/goldlineProgression.test.ts"
      - "shared/goldlineArcade*"
      - "shared/goldlineCamera*"
      - "shared/goldlineCustomerWindows*"
      - "shared/goldlineFuturePressure*"
      - "shared/goldlineObligations*"
      - "shared/goldlineTemporal*"
      - "shared/driverSafeSalesIntel.ts"
      - "client/public/goldline.webmanifest"
      - "client/public/goldline-sw.js"
      - "client/public/assets/goldline/**"
      - "e2e/goldline/**"
      - "e2e/goldline-smoke/**"
      - "playwright.goldline.config.ts"
      - "playwright.goldline-smoke.config.ts"
      - "scripts/checkGoldlineBundleBudget.mjs"
      - "scripts/verifyPlayableGoldline.mjs"
      - "scripts/verifyGoldlineFirstPlayGate.mjs"
      - "scripts/verifyGoldlineObjectiveHierarchyGate.mjs"
      - "scripts/verifyGoldlineTrueTouch.mjs"
      - "scripts/verifyGoldlineLocalTargetRunGate.mjs"
      - "scripts/verifyGoldlineOpenChannelExpedition.mjs"
      - "scripts/verifyGoldlineFieldIntel.mjs"
      - "scripts/verifyGoldlineExternalOrder.mjs"
      - "scripts/capture-goldline-closure.mjs"
      - "scripts/measure-goldline-performance.mjs"
      - "scripts/goldlineLocalProofTarget.mjs"
      - ".github/workflows/goldline-mobile-regression.yml"
      - ".github/workflows/goldline-fast-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldline-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/goldline_mobile_gate
  DAYFORGE_RELEASE_DB: "1"
  APP_SHARED_API_SECRET: goldline-mobile-app-secret-000000000000000000
  JWT_SECRET: goldline-mobile-jwt-secret-000000000000000000
  STRIPE_SECRET_KEY: goldline-mobile-placeholder-not-used
  DRIVER_PASSWORD: goldline-mobile-driver-pass
  DRIVER_OPEN_ID: goldline-mobile-driver

jobs:
  mobile-build-and-schema:
    name: mobile-build-and-schema
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goldline_mobile_gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository migrations to disposable MySQL
        run: pnpm db:legacy-dayforge:release
      - name: Build production application once
        run: VITE_GOLDLINE_TEST_HARNESS=1 pnpm build
      - name: Enforce Goldline bundle budget
        run: node scripts/checkGoldlineBundleBudget.mjs
      - name: Check whitespace errors
        run: git diff --check
      - name: Publish immutable production build
        uses: actions/upload-artifact@v4
        with:
          name: goldline-mobile-dist-${{ github.sha }}
          path: dist
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  mobile-unit:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mobile-business-loop-contracts
            command: >-
              pnpm vitest run
              client/src/game/actions
              client/src/game/encounters
              client/src/game/state/WorldProjection.test.ts
              client/src/game/state/MissionDirector.test.ts
              client/src/game/state/worldMemory.test.ts
              client/src/game/session/checkpointStorage.test.ts
              shared/goldlineProgression.test.ts
          - name: mobile-android-journal
            command: >-
              pnpm vitest run
              server/commercialMissions/driverSalesJournalResilience.test.ts
              client/src/components/driver/SalesMomentum.test.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lane
        run: ${{ matrix.command }}

  mobile-integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mobile-legacy-compatibility-release
            command: pnpm vitest run --config vitest.integration.config.ts server/legacyDayforgeRelease/legacyDayforgeReleaseJourney.integration.test.ts
          - name: mobile-armory
            command: pnpm vitest run --config vitest.integration.config.ts server/armory/armoryEvolution.integration.test.ts
          - name: mobile-sales-intel
            command: pnpm vitest run --config vitest.integration.config.ts server/salesIntel/driverSafeSalesIntel.integration.test.ts
          - name: mobile-visit-route
            command: pnpm vitest run --config vitest.integration.config.ts server/field/authoritativeVisitRoute.integration.test.ts
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goldline_mobile_gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository migrations to isolated MySQL
        run: pnpm db:legacy-dayforge:release
      - name: Run lane
        run: ${{ matrix.command }}

  mobile-browser:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: mobile-build-and-schema
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mobile-authoritative-business
            command: >-
              pnpm exec playwright test --config playwright.goldline.config.ts
              e2e/goldline/authoritativeBusinessChains.spec.ts
          - name: mobile-driver-shell-and-pixel
            command: >-
              pnpm exec playwright test --config playwright.goldline.config.ts
              e2e/goldline/businessActionResume.spec.ts
              e2e/goldline/driverHomeComposition.spec.ts
              e2e/goldline/driverHomeP1Safety.spec.ts
              e2e/goldline/driverHomeWorldComposition.spec.ts
              e2e/goldline/mobileTypographyFloor.spec.ts
              e2e/goldline/pixel9Layout.spec.ts
          - name: mobile-day-entry-overland
            command: >-
              pnpm exec playwright test --config playwright.goldline.config.ts
              e2e/goldline/dynamic-reroute.spec.ts
              e2e/goldline/emptyDayTruth.spec.ts
              e2e/goldline/firstThirtySeconds.spec.ts
              e2e/goldline/overlandEntry.spec.ts
              e2e/goldline/realDayIgnition.spec.ts
          - name: mobile-expandable-world
            command: >-
              pnpm exec playwright test --config playwright.goldline.config.ts
              e2e/goldline/expandableWorld.spec.ts
          - name: mobile-immersion
            command: >-
              pnpm exec playwright test --config playwright.goldline.config.ts
              e2e/goldline/immersion-gate.spec.ts
          - name: mobile-inhabited-adventure-a
            command: >-
              pnpm exec playwright test --config playwright.goldline.config.ts
              e2e/goldline/inhabitedAdventure.spec.ts
              --grep 'six ambient|CI preview|Anchor|Gatekeeper'
          - name: mobile-inhabited-adventure-b
            command: >-
              pnpm exec playwright test --config playwright.goldline.config.ts
              e2e/goldline/inhabitedAdventure.spec.ts
              --grep 'Ghost|Staller|reduced motion'
          - name: mobile-reality-route
            command: >-
              pnpm exec playwright test --config playwright.goldline.config.ts
              e2e/goldline/pickupDeliveryWorldObjective.spec.ts
              e2e/goldline/realityProgression.spec.ts
              e2e/goldline/today-route-persistence.spec.ts
              e2e/goldline/waywardStage.spec.ts
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goldline_mobile_gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository migrations to isolated MySQL
        run: pnpm db:legacy-dayforge:release
      - name: Restore shared production build
        uses: actions/download-artifact@v4
        with:
          name: goldline-mobile-dist-${{ github.sha }}
          path: dist
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-goldline-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser lane
        run: ${{ matrix.command }}

  mobile-real-touch-field:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: mobile-build-and-schema
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mobile-real-touch-objectives
            command: >-
              node scripts/verifyGoldlineObjectiveHierarchyGate.mjs &&
              node scripts/verifyGoldlineExternalOrder.mjs
          - name: mobile-real-touch-local-target
            command: node scripts/verifyGoldlineLocalTargetRunGate.mjs
          - name: mobile-real-touch-field-intel
            command: node scripts/verifyGoldlineFieldIntel.mjs
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goldline_mobile_gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository migrations to isolated MySQL
        run: pnpm db:legacy-dayforge:release
      - name: Restore shared production build
        uses: actions/download-artifact@v4
        with:
          name: goldline-mobile-dist-${{ github.sha }}
          path: dist
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-goldline-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Start production server
        run: |
          NODE_ENV=ci PORT=4176 node dist/index.js > /tmp/goldline-gate-server.log 2>&1 &
          echo $! > /tmp/goldline-gate-server.pid
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:4176/driver"; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "server never became ready"
          cat /tmp/goldline-gate-server.log
          exit 1
      - name: Prove permanent real-touch field gate
        timeout-minutes: 4
        env:
          GOLDLINE_VERIFY_URL: http://127.0.0.1:4176
        run: ${{ matrix.command }}
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/goldline-gate-server.pid ]; then
            kill "$(cat /tmp/goldline-gate-server.pid)" 2>/dev/null || true
          fi
