name: Goldline mobile regression

on:
  pull_request:
    paths:
      - "client/src/game/**"
      - "client/src/pages/driver/GoldlineDriverController.tsx"
      - "client/src/pages/Driver.tsx"
      # The Goldline page surfaces are part of the playable path, not
      # adjacent to it. OpenChannel.tsx owns the empty-day ignition and the
      # resume banner that realDayIgnition/emptyDayTruth/firstThirtySeconds
      # all exercise — and it was NOT covered here, so a change that broke
      # the front door of the app could merge without this gate ever
      # running. That is exactly how it broke.
      - "client/src/pages/goldline/**"
      # The whole directory, not one file. These are the driver's mobile
      # surfaces: LogSignalSheet owns field intel capture and
      # AddExternalWorkSheet owns CleanCloud intake, both reachable from the
      # live game screen. Neither was covered, so a change to either alone
      # could merge without this gate running — the same gap that let the
      # front door break, one directory over.
      - "client/src/components/driver/**"
      - "client/src/components/admin/control-room/**"
      - "server/commercialMissions/driverSalesMotivationService.ts"
      - "server/commercialMissions/driverSalesJournalResilience.test.ts"
      - "server/driverGameWorld/**"
      - "server/capabilities/expansionScoutCapability.ts"
      - "server/armory/armoryWeaponService.ts"
      - "server/armory/armoryRouter.ts"
      - "server/armory/armoryEvolution.integration.test.ts"
      - "server/salesIntel/driverSafeSalesIntel*"
      - "server/field/**"
      - "server/goldlineWorld/**"
      - "server/dayforgeRelease/dayforgeReleaseJourney.integration.test.ts"
      # LOCAL_TARGET_RUN (§PR77 Part 8-20): recognition, real sourcing (with
      # the labeled-simulation fallback), and the Field Intel linkage that
      # advances a run's progress. None of this was covered here, and it is
      # exactly the kind of truth-sensitive surface this workflow exists for.
      - "server/openChannel/**"
      - "server/impactSignals/**"
      - "shared/localTargetRun.ts"
      - "shared/localTargetRun.test.ts"
      - "shared/impactSignal.ts"
      - "shared/impactSignal.test.ts"
      - "shared/goldlineProgression.ts"
      - "shared/goldlineProgression.test.ts"
      - "shared/goldlineArcade*"
      - "shared/goldlineCamera*"
      - "shared/goldlineCustomerWindows*"
      - "shared/goldlineFuturePressure*"
      - "shared/goldlineObligations*"
      - "shared/goldlineTemporal*"
      - "shared/driverSafeSalesIntel.ts"
      - "client/public/goldline.webmanifest"
      - "client/public/goldline-sw.js"
      - "client/public/assets/goldline/**"
      - "e2e/goldline/**"
      - "e2e/goldline-smoke/**"
      - "playwright.goldline.config.ts"
      - "playwright.goldline-smoke.config.ts"
      - "scripts/checkGoldlineBundleBudget.mjs"
      - "scripts/verifyPlayableGoldline.mjs"
      - "scripts/verifyGoldlineFirstPlayGate.mjs"
      - "scripts/verifyGoldlineObjectiveHierarchyGate.mjs"
      - "scripts/verifyGoldlineTrueTouch.mjs"
      - "scripts/verifyGoldlineLocalTargetRunGate.mjs"
      - "scripts/verifyGoldlineOpenChannelExpedition.mjs"
      - "scripts/verifyGoldlineFieldIntel.mjs"
      - "scripts/verifyGoldlineExternalOrder.mjs"
      - "scripts/capture-goldline-closure.mjs"
      - "scripts/measure-goldline-performance.mjs"
      - "scripts/goldlineLocalProofTarget.mjs"
      - ".github/workflows/goldline-mobile-regression.yml"
      - ".github/workflows/goldline-fast-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldline-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixel-class-layout:
    runs-on: ubuntu-latest
    # The full browser matrix currently takes ~21 minutes on a shared runner,
    # followed by ~7 minutes of real-CDP touch proofs. Keep enough headroom for
    # runner variance and the final bundle/whitespace checks without weakening
    # either regression surface.
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goldline_mobile_gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CI: "true"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/goldline_mobile_gate
      DAYFORGE_RELEASE_DB: "1"
      APP_SHARED_API_SECRET: goldline-mobile-app-secret-000000000000000000
      JWT_SECRET: goldline-mobile-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: goldline-mobile-placeholder-not-used
      DRIVER_PASSWORD: goldline-mobile-driver-pass
      DRIVER_OPEN_ID: goldline-mobile-driver

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository migrations to disposable MySQL
        run: pnpm db:dayforge:release

      - name: Prove authoritative business-loop contracts
        run: >-
          pnpm vitest run
          client/src/game/actions
          client/src/game/encounters
          client/src/game/state/WorldProjection.test.ts
          client/src/game/state/MissionDirector.test.ts
          client/src/game/state/worldMemory.test.ts
          client/src/game/session/checkpointStorage.test.ts
          shared/goldlineProgression.test.ts

      - name: Prove Android journal audio resilience
        run: >-
          pnpm vitest run
          server/commercialMissions/driverSalesJournalResilience.test.ts
          client/src/components/driver/SalesMomentum.test.ts

      - name: Prove server-rebuilt progression and doctrine gates
        run: >-
          pnpm vitest run --config vitest.integration.config.ts
          server/dayforgeRelease/dayforgeReleaseJourney.integration.test.ts
          server/armory/armoryEvolution.integration.test.ts
          server/salesIntel/driverSafeSalesIntel.integration.test.ts
          server/field/authoritativeVisitRoute.integration.test.ts

      - name: Build production application
        run: VITE_GOLDLINE_TEST_HARNESS=1 pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove Pixel-class portrait / landscape / keyboard recovery
        run: pnpm exec playwright test --config playwright.goldline.config.ts

      - name: Start production server for real-touch permanent regression gates
        run: |
          NODE_ENV=ci PORT=4176 node dist/index.js > /tmp/goldline-gate-server.log 2>&1 &
          echo $! > /tmp/goldline-gate-server.pid
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:4176/driver"; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "server never became ready"
          cat /tmp/goldline-gate-server.log
          exit 1

      - name: Prove Goldline permanent regression gates (real CDP touch, not synthetic events)
        env:
          GOLDLINE_VERIFY_URL: http://127.0.0.1:4176
        run: |
          set -e
          # §PR77 Part 21A. verifyGoldlineFirstPlayGate.mjs is deliberately NOT
          # run here yet: to sidestep a genuine Chrome/CDP multi-touch quirk,
          # it releases the joystick before dispatching the deliberate STRIKE
          # tap (see the script's own comment, lines 296-303), which leaves the
          # player briefly stationary. On this runner that window was long
          # enough for the game's ambient passive-lash tick (fires only while
          # stationary) to defeat the low-HP tutorial hostile before the
          # deliberate tap landed, cascading every teaching-state check that
          # follows. verifyGoldlineTrueTouch.mjs solved this identical race by
          # holding the joystick down via real multi-touch through the whole
          # strike so the player is never stationary; FirstPlayGate needs the
          # same fix before it can gate merges without risking spurious
          # failures on a loaded runner. Passed reliably every local run.
          #
          # §PR77 Part 21E. One objective owner, tappable, controls unobstructed.
          node scripts/verifyGoldlineObjectiveHierarchyGate.mjs
          # §PR77 Part 7. verifyGoldlineTrueTouch.mjs is ALSO deliberately NOT
          # run here yet, for the same class of reason as FirstPlayGate above:
          # on this actual CI runner it failed with a real touch STRIKE
          # registering zero damage, a real flick never beginning an evade,
          # and a locked Line not firing on release — all passing reliably
          # locally. These scripts assume CDP round-trip latency and real
          # elapsed time between dispatched touch events stay well under the
          # game's own thresholds (HOLD_THRESHOLD_MS, the ambient-lash
          # cadence); that assumption does not hold on this runner, whether
          # from CDP latency itself or the page's rAF-driven game loop being
          # starved of CPU on a shared runner. Needs real investigation
          # against an actual CI run, not a local-only fix.
          # §PR77 Parts 8-20, 21F-J. LOCAL_TARGET_RUN recognition, truthful
          # partial sourcing, Field Intel linkage, resume, route progression,
          # and the labeled-simulation fallback badge.
          node scripts/verifyGoldlineLocalTargetRunGate.mjs
          # Pre-existing Field Intel and external-order proofs — covered by
          # this same touch harness, never previously gated in CI.
          #
          # verifyGoldlineOpenChannelExpedition.mjs is deliberately NOT run
          # here yet: its "ACT still dodges on a non-order objective" check
          # has a real, pre-existing (predates this change) CDP-timing race
          # under load — confirmed reproducing on main independent of any
          # LOCAL_TARGET_RUN work — and needs its own fix before it can gate
          # merges without risking spurious failures.
          node scripts/verifyGoldlineFieldIntel.mjs
          node scripts/verifyGoldlineExternalOrder.mjs

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/goldline-gate-server.pid ]; then
            kill "$(cat /tmp/goldline-gate-server.pid)" 2>/dev/null || true
          fi

      - name: Enforce Goldline bundle budget
        run: node scripts/checkGoldlineBundleBudget.mjs

      - name: Check whitespace errors
        run: git diff --check
