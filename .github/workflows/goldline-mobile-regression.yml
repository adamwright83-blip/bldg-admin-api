name: Goldline mobile regression

on:
  pull_request:
    paths:
      - "client/src/game/**"
      - "client/src/pages/driver/GoldlineDriverController.tsx"
      - "server/driverGameWorld/**"
      - "server/capabilities/expansionScoutCapability.ts"
      - "server/armory/armoryWeaponService.ts"
      - "server/armory/armoryRouter.ts"
      - "server/armory/armoryEvolution.integration.test.ts"
      - "server/salesIntel/driverSafeSalesIntel*"
      - "server/field/**"
      - "server/dayforgeRelease/dayforgeReleaseJourney.integration.test.ts"
      - "shared/goldlineProgression.ts"
      - "shared/goldlineProgression.test.ts"
      - "shared/driverSafeSalesIntel.ts"
      - "client/public/goldline.webmanifest"
      - "client/public/goldline-sw.js"
      - "client/public/assets/goldline/**"
      - "e2e/goldline/**"
      - "playwright.goldline.config.ts"
      - "scripts/checkGoldlineBundleBudget.mjs"
      - "scripts/verifyPlayableGoldline.mjs"
      - ".github/workflows/goldline-mobile-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldline-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixel-class-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goldline_mobile_gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CI: "true"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/goldline_mobile_gate
      DAYFORGE_RELEASE_DB: "1"
      APP_SHARED_API_SECRET: goldline-mobile-app-secret-000000000000000000
      JWT_SECRET: goldline-mobile-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: goldline-mobile-placeholder-not-used
      DRIVER_PASSWORD: goldline-mobile-driver-pass
      DRIVER_OPEN_ID: goldline-mobile-driver

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository migrations to disposable MySQL
        run: pnpm db:dayforge:release

      - name: Prove authoritative business-loop contracts
        run: >-
          pnpm vitest run
          client/src/game/actions
          client/src/game/encounters
          client/src/game/state/WorldProjection.test.ts
          client/src/game/state/MissionDirector.test.ts
          client/src/game/state/worldMemory.test.ts
          client/src/game/session/checkpointStorage.test.ts
          shared/goldlineProgression.test.ts

      - name: Prove server-rebuilt progression and doctrine gates
        run: >-
          pnpm vitest run --config vitest.integration.config.ts
          server/dayforgeRelease/dayforgeReleaseJourney.integration.test.ts
          server/armory/armoryEvolution.integration.test.ts
          server/salesIntel/driverSafeSalesIntel.integration.test.ts
          server/field/authoritativeVisitRoute.integration.test.ts

      - name: Build production application
        run: VITE_GOLDLINE_TEST_HARNESS=1 pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove Pixel-class portrait / landscape / keyboard recovery
        run: pnpm exec playwright test --config playwright.goldline.config.ts

      - name: Enforce Goldline bundle budget
        run: node scripts/checkGoldlineBundleBudget.mjs

      - name: Check whitespace errors
        run: git diff --check
