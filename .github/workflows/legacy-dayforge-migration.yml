name: Retired-name semantic migration

on:
  push:
    branches:
      - chatgpt/legacy-dayforge-semantic-hygiene-0924

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[naming-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate retired product naming
        run: node scripts/migrate-retired-product-name.mjs
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goldline Naming Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor: namespace retired product name [naming-migrated]"
          git push origin HEAD:${GITHUB_REF_NAME}
