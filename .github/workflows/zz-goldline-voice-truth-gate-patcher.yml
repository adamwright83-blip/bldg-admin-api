name: Goldline voice truth gate patcher

on:
  push:
    branches:
      - agent/goldline-voice-truth-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/goldline-voice-truth-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply voice truth repair
        shell: bash
        run: |
          python3 <<'PY'
