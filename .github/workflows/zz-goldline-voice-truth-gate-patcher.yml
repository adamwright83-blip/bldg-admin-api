name: Goldline voice truth gate patcher

on:
  push:
    branches:
      - agent/goldline-voice-truth-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/goldline-voice-truth-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply repair
        run: python3 .github/voice-truth-patch.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove voice truth contracts
        run: pnpm vitest run server/openChannel/openChannelService.test.ts server/openChannel/openChannelContract.test.ts
      - name: Check diff
        run: git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Goldline Voice Truth Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(goldline): preserve voice briefing truth [voice-truth-applied]"
          git push origin HEAD:agent/goldline-voice-truth-gate
