name: Goldline voice truth gate patcher

on:
  push:
    branches:
      - agent/goldline-voice-truth-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/goldline-voice-truth-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply repair
        shell: bash
        run: |
          python3 .github/voice-truth-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/openChannel/openChannelContract.test.ts')
          text = p.read_text()
          expected = 'expect(router.match(/dayforgeTenantMemberProcedure/g)).toHaveLength(6);'
          if expected not in text:
              raise SystemExit('authenticated route count contract anchor missing')
          p.write_text(text.replace(expected, 'expect(router.match(/dayforgeTenantMemberProcedure/g)).toHaveLength(8);', 1))
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove voice truth contracts
        run: pnpm vitest run server/openChannel/openChannelService.test.ts server/openChannel/openChannelContract.test.ts
      - name: Check diff
        run: git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Goldline Voice Truth Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(goldline): preserve voice briefing truth [voice-truth-applied]"
          git push origin HEAD:agent/goldline-voice-truth-gate
