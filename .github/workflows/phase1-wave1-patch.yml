name: Phase 1 Wave 1 patcher

on:
  push:
    branches:
      - cursor/goldline-close-real-workday
    paths:
      - .github/workflows/phase1-wave1-patch.yml

permissions:
  contents: write

jobs:
  patch-and-prove:
    if: github.event.head_commit.message == 'chore: stage real-workday wave1 patcher'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/goldline-close-real-workday
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded Real Workday truth patch
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"{path}: start marker not found: {start!r}")
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f"{path}: end marker not found: {end!r}")
              if text.find(start, a + len(start)) >= 0 and text.find(start, a + len(start)) < b:
                  raise SystemExit(f"{path}: ambiguous nested start marker")
              p.write_text(text[:a] + replacement + text[b:])

          # Shared visit vocabulary: unresolved reality has no mission-state promotion.
          replace_once(
              "shared/commercialMissionField.ts",
              'export type FieldOutcomeReason = (typeof FIELD_OUTCOME_REASONS)[number];\n\nexport function navigationUrl',
              '''export type FieldOutcomeReason = (typeof FIELD_OUTCOME_REASONS)[number];

export const FIELD_VISIT_OUTCOMES = [
  "no_contact",
  "no_decision",
  "follow_up",
  "won",
  "lost",
] as const;
export type FieldVisitOutcome = (typeof FIELD_VISIT_OUTCOMES)[number];

export function missionStatusForFieldVisitOutcome(
  outcome: FieldVisitOutcome
): "follow_up" | "won" | "lost" | null {
  return outcome === "follow_up" || outcome === "won" || outcome === "lost"
    ? outcome
    : null;
}

export function navigationUrl'''
          )

          # Follow-up attempts distinguish contact from business outcome.
          replace_once(
              "shared/commercialPipeline.ts",
              'export type CommercialPipelineStage =\n  (typeof COMMERCIAL_PIPELINE_STAGES)[number];\n',
              '''export type CommercialPipelineStage =
  (typeof COMMERCIAL_PIPELINE_STAGES)[number];

export const COMMERCIAL_FOLLOW_UP_OUTCOMES = [
  "no_contact",
  "contacted_no_decision",
  "won",
  "lost",
] as const;
export type CommercialFollowUpOutcome =
  (typeof COMMERCIAL_FOLLOW_UP_OUTCOMES)[number];

export function missionStatusForFollowUpOutcome(
  outcome: CommercialFollowUpOutcome
): "won" | "lost" | null {
  return outcome === "won" || outcome === "lost" ? outcome : null;
}
'''
          )

