name: Claire approved-view analysis
on:
  pull_request:
    paths:
      - 'server/analytics/**'
      - 'server/claire/**'
      - 'server/strategy/**'
      - 'server/_core/llm*'
      - 'server/domains/orders/orderHistoryReadService.ts'
      - 'scripts/claire-analysis-*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/claire-analysis.yml'
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request supersedes this run. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # sourceBackedAction.test.ts opens its own disposable schema on 127.0.0.1:3399.
      # DATABASE_URL stays empty so the rest of this job does not attach to it.
      source_backed_mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: source_backed_disposable
        ports:
          - 3399:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      ANTHROPIC_API_KEY: ''
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Canonical money, hostile SQL, resource limits, conversation, Showrunner and authority regressions
        run: pnpm vitest run server/analytics server/claire server/strategy server/_core/llm.test.ts
      - name: Verify production packaging and the trusted worker entrypoint
        run: pnpm build && node --check dist/analysisWorker.cjs
