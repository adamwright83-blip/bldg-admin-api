name: Legacy nomenclature inventory

on:
  pull_request:
    branches: [main]

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate retired product-name references
        shell: bash
        run: |
          set -euo pipefail
          needle="$(printf 'day%s' 'forge')"
          echo "=== PATHS ==="
          git ls-files | grep -i "$needle" || true
          echo "=== CONTENT ==="
          git grep -n -i "$needle" -- ':!pnpm-lock.yaml' ':!package-lock.json' ':!yarn.lock' || true
          exit 1
