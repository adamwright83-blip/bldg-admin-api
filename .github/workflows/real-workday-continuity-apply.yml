name: Real Workday continuity apply

on:
  push:
    branches:
      - cursor/goldline-real-workday

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/goldline-real-workday
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Real Workday continuation
        run: |
          python scripts/realWorkdayRemoteApply.py
          python scripts/realWorkdayRemoteFix.py
      - name: Run focused truth and mobile-model tests
        run: pnpm vitest run client/src/game/session/drivingLikelihood.test.ts client/src/game/session/physicalArrival.test.ts shared/goldlineFuturePressure.test.ts client/src/pages/driver/goldlineDayPlanModel.test.ts
      - name: Push product commit
        shell: bash
        run: |
          git config user.name "goldline-real-workday"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/real-workday-continuity-apply.yml scripts/realWorkdayRemoteApply.py scripts/realWorkdayRemoteFix.py
          git commit -m "feat(real-workday): surface provenance and lock play while driving"
          git push origin HEAD:cursor/goldline-real-workday
