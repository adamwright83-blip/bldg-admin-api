  lat: number;
  lng: number;
  accuracyMeters: number;
  timestampMs: number;
  speedMetersPerSecond: number | null;
};

export type DrivingLikelihoodSnapshot = {
  likely: boolean;
  speedMetersPerSecond: number | null;
  goodSamples: number;
};

const MAX_ACCURACY_METERS = 80;
const ENTER_SPEED_MPS = 8; // ~18 mph: deliberately above walking/cycling ambiguity.
const EXIT_SPEED_MPS = 2.5;
const ENTER_SAMPLES = 3;
const EXIT_SAMPLES = 3;
const ENTER_SPAN_MS = 6_000;
const EXIT_SPAN_MS = 8_000;

function radians(value: number) { return (value * Math.PI) / 180; }
function distanceMeters(a: DrivingLocationSample, b: DrivingLocationSample): number {
  const earth = 6_371_000;
  const dLat = radians(b.lat - a.lat);
  const dLng = radians(b.lng - a.lng);
  const lat1 = radians(a.lat);
  const lat2 = radians(b.lat);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return 2 * earth * Math.asin(Math.min(1, Math.sqrt(h)));
}

export class DrivingLikelihoodTracker {
  private likely = false;
  private high: Array<{ at: number; speed: number }> = [];
  private low: Array<{ at: number; speed: number }> = [];
  private previous: DrivingLocationSample | null = null;
  private speed: number | null = null;

  ingest(sample: DrivingLocationSample): DrivingLikelihoodSnapshot {
    if (!Number.isFinite(sample.lat) || !Number.isFinite(sample.lng) ||
        !Number.isFinite(sample.accuracyMeters) || sample.accuracyMeters <= 0 ||
        sample.accuracyMeters > MAX_ACCURACY_METERS) return this.snapshot();
    if (this.previous && sample.timestampMs <= this.previous.timestampMs) return this.snapshot();

    let speed = sample.speedMetersPerSecond != null && Number.isFinite(sample.speedMetersPerSecond)
      ? Math.max(0, sample.speedMetersPerSecond)
      : null;
    if (speed == null && this.previous) {
      const dt = sample.timestampMs - this.previous.timestampMs;
      if (dt >= 1_000 && dt <= 20_000 && this.previous.accuracyMeters <= MAX_ACCURACY_METERS) {
        speed = distanceMeters(this.previous, sample) / (dt / 1000);
      }
    }
    this.previous = sample;
    this.speed = speed;
    if (speed == null) return this.snapshot();

    if (!this.likely) {
      if (speed >= ENTER_SPEED_MPS) {
        this.high.push({ at: sample.timestampMs, speed });
        this.high = this.high.filter(item => sample.timestampMs - item.at <= 20_000);
        const span = this.high.length > 1 ? sample.timestampMs - this.high[0]!.at : 0;
        if (this.high.length >= ENTER_SAMPLES && span >= ENTER_SPAN_MS) {
          this.likely = true;
          this.low = [];
        }
      } else {
        this.high = [];
      }
    } else if (speed <= EXIT_SPEED_MPS) {
      this.low.push({ at: sample.timestampMs, speed });
      this.low = this.low.filter(item => sample.timestampMs - item.at <= 25_000);
      const span = this.low.length > 1 ? sample.timestampMs - this.low[0]!.at : 0;
      if (this.low.length >= EXIT_SAMPLES && span >= EXIT_SPAN_MS) {
        this.likely = false;
        this.high = [];
      }
    } else {
      this.low = [];
    }
    return this.snapshot();
  }

  snapshot(): DrivingLikelihoodSnapshot {
    return { likely: this.likely, speedMetersPerSecond: this.speed, goodSamples: this.likely ? this.low.length : this.high.length };
  }
}
''')

          Path("client/src/game/session/drivingLikelihood.test.ts").write_text(r'''import { describe, expect, it } from "vitest";
import { DrivingLikelihoodTracker, type DrivingLocationSample } from "./drivingLikelihood";

const at = (t: number, speed: number | null, lat = 34): DrivingLocationSample => ({
  lat, lng: -118.3, accuracyMeters: 12, timestampMs: t, speedMetersPerSecond: speed,
});

describe("conservative driving likelihood", () => {
  it("does not call walking or one speed spike driving", () => {
    const tracker = new DrivingLikelihoodTracker();
    tracker.ingest(at(0, 1.4));
    tracker.ingest(at(4_000, 14));
    expect(tracker.ingest(at(8_000, 1.1)).likely).toBe(false);
  });

  it("requires sustained vehicle speed", () => {
    const tracker = new DrivingLikelihoodTracker();
    tracker.ingest(at(0, 10));
    tracker.ingest(at(3_500, 12));
    expect(tracker.ingest(at(7_000, 11)).likely).toBe(true);
  });

  it("does not clear driving from a single stoplight sample", () => {
    const tracker = new DrivingLikelihoodTracker();
    tracker.ingest(at(0, 10)); tracker.ingest(at(3_500, 12)); tracker.ingest(at(7_000, 11));
    expect(tracker.ingest(at(9_000, 0)).likely).toBe(true);
    expect(tracker.ingest(at(11_000, 10)).likely).toBe(true);
  });

  it("returns controls after sustained parked speed", () => {
    const tracker = new DrivingLikelihoodTracker();
    tracker.ingest(at(0, 10)); tracker.ingest(at(3_500, 12)); tracker.ingest(at(7_000, 11));
    tracker.ingest(at(10_000, 0)); tracker.ingest(at(14_500, 0));
    expect(tracker.ingest(at(19_000, 0)).likely).toBe(false);
  });

  it("ignores low-quality samples", () => {
    const tracker = new DrivingLikelihoodTracker();
    const bad = { ...at(0, 20), accuracyMeters: 180 };
    expect(tracker.ingest(bad).likely).toBe(false);
  });
});
''')

          Path("client/src/game/session/useDrivingLikelihood.ts").write_text(r'''import { useEffect, useRef, useState } from "react";
import { DrivingLikelihoodTracker, type DrivingLikelihoodSnapshot } from "./drivingLikelihood";

export type DrivingAvailability = "unsupported" | "permission_denied" | "unavailable" | "watching";

export function useDrivingLikelihood(): { availability: DrivingAvailability; snapshot: DrivingLikelihoodSnapshot } {
  const trackerRef = useRef(new DrivingLikelihoodTracker());
  const [availability, setAvailability] = useState<DrivingAvailability>("unavailable");
  const [snapshot, setSnapshot] = useState(() => trackerRef.current.snapshot());

  useEffect(() => {
    if (typeof navigator === "undefined" || !navigator.geolocation) {
      setAvailability("unsupported");
      return;
    }
    const watchId = navigator.geolocation.watchPosition(
      position => {
        setAvailability("watching");
        setSnapshot(trackerRef.current.ingest({
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracyMeters: position.coords.accuracy,
          timestampMs: position.timestamp,
          speedMetersPerSecond: position.coords.speed,
        }));
      },
      error => setAvailability(error.code === error.PERMISSION_DENIED ? "permission_denied" : "unavailable"),
      // Low-power watcher: precise doorstep confirmation has its own short-lived high-accuracy hook.
      { enableHighAccuracy: false, maximumAge: 10_000, timeout: 20_000 }
    );
    return () => navigator.geolocation.clearWatch(watchId);
  }, []);

  return { availability, snapshot };
}
''')

