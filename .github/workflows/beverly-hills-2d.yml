name: Beverly Hills 2D adventure

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beverly-hills-2d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adventure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Puzzle, outreach evidence and preserved neighborhood contracts
        run: pnpm exec vitest run client/src/pages/goldline/beverlyHills2d shared/beverlyHillsOutreach.test.ts server/experience/lanternCity/beverlyHillsOutreach.test.ts shared/beverlyHillsProspects.test.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Desktop and mobile adventure, resume and pending journal
        run: pnpm exec playwright test --config playwright.beverly-hills.config.ts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: beverly-hills-2d-failures
          path: test-results/
