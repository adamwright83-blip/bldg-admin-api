name: Beverly Hills 2D adventure

on:
  # Run by ci.yml when a change needs it (scripts/ci/ciAreas.mjs), nightly, and by hand.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adventure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Puzzle, outreach evidence and preserved neighborhood contracts
        run: pnpm exec vitest run client/src/pages/goldline/beverlyHills2d shared/beverlyHillsOutreach.test.ts server/experience/lanternCity/beverlyHillsOutreach.test.ts shared/beverlyHillsProspects.test.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Desktop and mobile adventure, resume and pending journal
        run: pnpm exec playwright test --config playwright.beverly-hills.config.ts --grep-invert "round-up plays with real controls"
      # QUARANTINED on pull requests (docs/ci/CI_SCOPES.md#quarantine): the boxer charge at
      # round-up.spec.ts:39 misses its 4 s window in about one run in seven, on unrelated changes.
      # It still runs and reports on every pull request that reaches Beverly Hills, and it blocks the
      # nightly run. Fold it back into the step above when the Round-Up de-flake lands.
      - name: Round-Up (quarantined on pull requests)
        id: round-up
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec playwright test --config playwright.beverly-hills.config.ts round-up.spec.ts
      - name: Report a quarantined failure
        if: steps.round-up.outcome == 'failure'
        run: echo "::warning title=Quarantined test failed::e2e/beverly-hills-2d/round-up.spec.ts failed. It does not block this pull request; see docs/ci/CI_SCOPES.md#quarantine."
      - uses: actions/upload-artifact@v6
        if: failure() || steps.round-up.outcome == 'failure'
        with:
          name: beverly-hills-2d-failures
          path: test-results/
