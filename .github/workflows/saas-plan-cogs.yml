name: SaaS plan COGS gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-cogs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3415:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3415/joystick_saas_cogs
      APP_SHARED_API_SECRET: cogs-app-secret-000000000000000000
      JWT_SECRET: cogs-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: cogs-placeholder-not-used
      DRIVER_PASSWORD: cogs-driver
      DRIVER_OPEN_ID: cogs-driver
      ADMIN_PASSWORD: cogs-admin
      SAAS_COGS_EXAM: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm check
      - name: Create disposable COGS database
        run: |
          node -e "
            const mysql = require('mysql2/promise');
            (async () => {
              const conn = await mysql.createConnection('mysql://root:root@127.0.0.1:3415/');
              await conn.query('DROP DATABASE IF EXISTS joystick_saas_cogs');
              await conn.query('CREATE DATABASE joystick_saas_cogs');
              await conn.end();
            })().catch(err => { console.error(err); process.exit(1); });
          "
      - name: Bootstrap production schema
        run: node scripts/migrate.mjs
      - name: Prove plan-aware tenant COGS isolation
        run: pnpm vitest run --config vitest.integration.config.ts server/saas/tenantCogs.integration.test.ts
