name: President autonomous agent

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: president-autonomous-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  president-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run President autonomous agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRESIDENT_AGENT_BASE_URL: https://admin.bldg.chat
        run: pnpm exec tsx scripts/president-github-agent.ts
