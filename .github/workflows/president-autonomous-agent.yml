name: President autonomous agent

on:
  schedule:
    # 18:00–10:59 Los Angeles across PST/PDT; three slots run in parallel.
    - cron: "*/15 2-17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  president-agent:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    concurrency:
      group: president-autonomous-agent-${{ matrix.slot }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run President autonomous agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRESIDENT_AGENT_BASE_URL: https://admin.bldg.chat
          PRESIDENT_AGENT_MODEL: claude-sonnet-4-6
        run: pnpm exec tsx scripts/president-github-agent.ts

      - name: Preserve browser validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: president-browser-${{ github.run_id }}-${{ matrix.slot }}
          path: ${{ runner.temp }}/president-browser
          if-no-files-found: ignore
          retention-days: 30
