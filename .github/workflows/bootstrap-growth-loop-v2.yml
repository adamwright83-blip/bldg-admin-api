name: Bootstrap Goldline growth loop v2
on:
  push:
    branches: [feature/goldline-growth-loop-hardening]
    paths: [.github/workflows/bootstrap-growth-loop-v2.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: growth_loop }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/growth_loop
      DAYFORGE_RELEASE_DB: "1"
      APP_SHARED_API_SECRET: growth-loop-app-secret-000000000000000000
      JWT_SECRET: growth-loop-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: growth-loop-placeholder-not-used
    steps:
      - uses: actions/checkout@v7
        with: { ref: feature/goldline-growth-loop-hardening }
      - uses: pnpm/action-setup@v6
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply slices 1, 3, 5
        run: |
          python3 <<'PY'
          from pathlib import Path
          def r(path, old, new):
            p=Path(path); s=p.read_text()
            if s.count(old)!=1: raise SystemExit(f"anchor {path} count={s.count(old)}")
            p.write_text(s.replace(old,new,1))

          p=Path('shared/dayforgeEvents.ts'); s=p.read_text()
          s=s.replace('  "cold_call_batch_started",\n  "cold_call_outcome_saved",','  "cold_call_batch_started",\n  "cold_call_target_started",\n  "cold_call_outcome_saved",')
          s=s.replace('  cold_call_batch_started: { sessionId: string; targetCount: number };\n  cold_call_outcome_saved:','  cold_call_batch_started: { sessionId: string; targetCount: number };\n  cold_call_target_started: { sessionId: string };\n  cold_call_outcome_saved:')
          s=s.replace('  cold_call_batch_started: ["sessionId", "targetCount"],\n  cold_call_outcome_saved:','  cold_call_batch_started: ["sessionId", "targetCount"],\n  cold_call_target_started: ["sessionId"],\n  cold_call_outcome_saved:')
          p.write_text(s)

          r('client/src/game/GoldlineGameHome.tsx','''  function handleColdCallComplete(input: Parameters<GoldlineGameHomeProps["onCompleteColdCall"]>[0]) {\n    emit?.({\n      eventName: "cold_call_outcome_saved",\n      sessionId: sessionIdRef.current,\n      missionId: null,\n      properties: { sessionId: sessionIdRef.current, outcome: input.outcome },\n    });\n    return props.onCompleteColdCall(input);\n  }\n''','''  function handleColdCallStart(target: ColdCallTarget) {\n    return props.onStartColdCall(target).then(batch => {\n      emit?.({ eventName: "cold_call_target_started", sessionId: sessionIdRef.current, missionId: target.missionId, properties: { sessionId: sessionIdRef.current } });\n      return batch;\n    });\n  }\n\n  function handleColdCallComplete(input: Parameters<GoldlineGameHomeProps["onCompleteColdCall"]>[0]) {\n    return props.onCompleteColdCall(input).then(batch => {\n      emit?.({ eventName: "cold_call_outcome_saved", sessionId: sessionIdRef.current, missionId: input.target.missionId, properties: { sessionId: sessionIdRef.current, outcome: input.outcome } });\n      return batch;\n    });\n  }\n''')
          r('client/src/game/GoldlineGameHome.tsx','            onStart={props.onStartColdCall}\n','            onStart={handleColdCallStart}\n')

          Path('server/dayforgeEvents/goldlineEffectivenessQueries.ts').write_text('''import { and, eq, gte, sql } from "drizzle-orm";\nimport { dayforgeProductEvents } from "../../drizzle/schema";\nimport { getDb } from "../db";\nexport type GoldlineEffectivenessSummary={windowDays:number;play:{sessionsStarted:number;missionsApproached:number;missionsEngaged:number;encountersResolved:number};businessAction:{weaponsSelected:number;weaponsUsed:number;coldCallTargetsStarted:number;coldCallOutcomesSaved:number};trustedBusinessOutcome:{visitsCompleted:number;followUpsCreated:number;accountsWon:number;accountsLost:number};missionProgression:{mutationsCreated:number;verifiedCaptures:number};recovery:{mutationsFollowed:number};scoutExpansion:{runsStarted:number;discoveriesCreated:number;missionsCreated:number}};\nasync function countEvent(i:{tenantId:string;eventName:string;since:Date}){const db=await getDb();if(!db)throw new Error("Database not available");const [row]=await db.select({count:sql<number>`COUNT(*)`}).from(dayforgeProductEvents).where(and(eq(dayforgeProductEvents.tenantId,i.tenantId),eq(dayforgeProductEvents.eventName,i.eventName),gte(dayforgeProductEvents.occurredAt,i.since)));return Number(row?.count??0)}\nexport async function getGoldlineEffectivenessSummary(i:{tenantId:string;windowDays?:number}):Promise<GoldlineEffectivenessSummary>{const windowDays=i.windowDays??30,since=new Date(Date.now()-windowDays*86400000),c=(eventName:string)=>countEvent({tenantId:i.tenantId,eventName,since});const [sessionsStarted,missionsApproached,missionsEngaged,encountersResolved,weaponsSelected,weaponsUsed,coldCallTargetsStarted,coldCallOutcomesSaved,visitsCompleted,followUpsCreated,accountsWon,accountsLost,mutationsCreated,verifiedCaptures,mutationsFollowed,runsStarted,discoveriesCreated,missionsCreated]=await Promise.all([c("goldline_session_started"),c("mission_approached"),c("mission_engaged"),c("encounter_resolved"),c("armory_weapon_selected"),c("armory_weapon_used"),c("cold_call_target_started"),c("cold_call_outcome_saved"),c("visit_completed"),c("follow_up_created"),c("account_won"),c("account_lost"),c("mutation_created"),c("verified_capture"),c("mutation_followed"),c("scout_run_started"),c("scout_discovery_created"),c("scout_mission_created")]);return{windowDays,play:{sessionsStarted,missionsApproached,missionsEngaged,encountersResolved},businessAction:{weaponsSelected,weaponsUsed,coldCallTargetsStarted,coldCallOutcomesSaved},trustedBusinessOutcome:{visitsCompleted,followUpsCreated,accountsWon,accountsLost},missionProgression:{mutationsCreated,verifiedCaptures},recovery:{mutationsFollowed},scoutExpansion:{runsStarted,discoveriesCreated,missionsCreated}}}\n''')
          Path('client/src/pages/GoldlineEffectivenessAdmin.tsx').write_text('''import { Loader2 } from "lucide-react";\nimport { trpc } from "@/lib/trpc";\nfunction Row({label,value}:{label:string;value:number}){return <div className="effectiveness-stat-row"><span>{label}</span><b>{value}</b></div>}\nfunction Block({title,children}:{title:string;children:React.ReactNode}){return <article className="sales-intel-source"><div className="sales-intel-source-head"><span><b>{title}</b></span></div>{children}</article>}\nexport default function GoldlineEffectivenessAdmin(){const q=trpc.system.goldlineEvents.effectivenessSummary.useQuery({});const d=q.data;return <main className="sales-intel-admin"><header><div><small>INTERNAL · GOLDLINE EFFECTIVENESS</small><h1>Play and business behavior</h1><p>Observed counts over the last {d?.windowDays??30} days. Game behavior and trusted business outcomes are shown separately. These are associations, not a causal lift or ROI claim.</p></div></header>{q.isLoading?<p className="sales-intel-empty"><Loader2 className="h-4 w-4 animate-spin"/> Loading…</p>:null}{d?<section className="sales-intel-sources"><Block title="PLAY"><Row label="Sessions started" value={d.play.sessionsStarted}/><Row label="Missions approached" value={d.play.missionsApproached}/><Row label="Missions engaged" value={d.play.missionsEngaged}/><Row label="Encounters resolved" value={d.play.encountersResolved}/></Block><Block title="BUSINESS ACTION"><Row label="Armory weapons selected" value={d.businessAction.weaponsSelected}/><Row label="Armory usage persisted" value={d.businessAction.weaponsUsed}/><Row label="Cold-call targets started" value={d.businessAction.coldCallTargetsStarted}/><Row label="Cold-call outcomes persisted" value={d.businessAction.coldCallOutcomesSaved}/></Block><Block title="TRUSTED BUSINESS OUTCOME"><Row label="Visits completed" value={d.trustedBusinessOutcome.visitsCompleted}/><Row label="Follow-ups created" value={d.trustedBusinessOutcome.followUpsCreated}/><Row label="Accounts won" value={d.trustedBusinessOutcome.accountsWon}/><Row label="Accounts lost" value={d.trustedBusinessOutcome.accountsLost}/></Block><Block title="MISSION PROGRESSION"><Row label="World mutations created" value={d.missionProgression.mutationsCreated}/><Row label="Verified captures" value={d.missionProgression.verifiedCaptures}/></Block><Block title="RECOVERY"><Row label="Recovery paths followed" value={d.recovery.mutationsFollowed}/></Block><Block title="SCOUT / EXPANSION"><Row label="Scout runs started" value={d.scoutExpansion.runsStarted}/><Row label="Discoveries created" value={d.scoutExpansion.discoveriesCreated}/><Row label="Missions created from Scout" value={d.scoutExpansion.missionsCreated}/></Block></section>:null}</main>}\n''')

          r('server/salesIntel/salesIntelStore.ts','''  const rows = await database\n    .selectDistinct({ sourceArtifactId: salesIntelFrameworks.sourceArtifactId })\n    .from(salesIntelFrameworks)\n    .where(\n      and(\n        eq(salesIntelFrameworks.archetype, input.archetype),\n        eq(salesIntelFrameworks.channel, input.channel),\n        eq(salesIntelFrameworks.responseFamily, input.responseFamily),\n        eq(salesIntelFrameworks.active, true)\n      )\n    );\n  return rows.filter(row => row.sourceArtifactId !== input.sourceArtifactId).length;\n''','''  const rows = await database\n    .selectDistinct({ sourceArtifactId: salesIntelFrameworks.sourceArtifactId })\n    .from(salesIntelFrameworks)\n    .innerJoin(salesIntelSourceArtifacts, eq(salesIntelSourceArtifacts.id, salesIntelFrameworks.sourceArtifactId))\n    .where(and(eq(salesIntelFrameworks.archetype,input.archetype),eq(salesIntelFrameworks.channel,input.channel),eq(salesIntelFrameworks.responseFamily,input.responseFamily),eq(salesIntelFrameworks.reviewState,"accepted"),eq(salesIntelFrameworks.active,true),eq(salesIntelSourceArtifacts.status,"extracted"),inArray(salesIntelSourceArtifacts.sourceType,["manual_url","instagram","youtube","podcast","uploaded_transcript","other"])));\n  return rows.filter(row => row.sourceArtifactId !== input.sourceArtifactId).length;\n''')

          r('client/src/pages/SalesIntelAdmin.tsx','          body="High-confidence extractions are accepted automatically; everything else lands here."\n','          body="Extracted trainer frameworks stay here until a human accepts or rejects them."\n')
          r('client/src/pages/SalesIntelAdmin.tsx','''            {entry.teaching.exampleLanguage.length ? (\n              <ul className="si-hint mt-2 flex flex-col gap-1 text-sm italic">\n                {entry.teaching.exampleLanguage.map((phrase, i) => (\n                  <li key={i}>"{phrase.text}"</li>\n                ))}\n              </ul>\n            ) : null}\n''','''            {entry.teaching.exampleLanguage.length ? (<ul className="si-hint mt-2 flex flex-col gap-2 text-sm">{entry.teaching.exampleLanguage.map((phrase,i)=><li key={i} className="flex flex-wrap items-start gap-2"><Badge tone={phrase.kind === "exact_source_phrase" ? "quote" : "paraphrase"}>{phrase.kind === "exact_source_phrase" ? "EXACT SOURCE" : "PARAPHRASE"}</Badge><span className="italic">"{phrase.text}"</span></li>)}</ul>) : null}\n            {entry.teaching.whenToUse.length ? <p className="si-hint mt-2 text-sm"><b className="text-foreground">WHEN TO USE:</b> {entry.teaching.whenToUse.join(" · ")}</p> : null}\n            {entry.teaching.whenNotToUse.length ? <p className="si-hint mt-1 text-sm"><b className="text-foreground">WHEN NOT TO USE:</b> {entry.teaching.whenNotToUse.join(" · ")}</p> : null}\n''')
          r('client/src/pages/SalesIntelAdmin.tsx','''                {entry.teaching.transcriptStartMs != null ? (\n                  <> · segment starts {Math.floor(entry.teaching.transcriptStartMs / 1000)}s</>\n                ) : null}\n''','''                {entry.teaching.transcriptStartMs != null ? <> · evidence {Math.floor(entry.teaching.transcriptStartMs / 1000)}s{entry.teaching.transcriptEndMs != null ? `–${Math.floor(entry.teaching.transcriptEndMs / 1000)}s` : ""}</> : null}\n''')
          r('client/src/pages/SalesIntelAdmin.tsx','                Confidence: {entry.teaching.confidence.toFixed(2)}','                Model extraction confidence: {entry.teaching.confidence.toFixed(2)}')
          r('client/src/pages/SalesIntelAdmin.tsx','''            <div className="mt-3 flex flex-wrap gap-2">\n              <Button\n                size="sm"\n                disabled={review.isPending}\n                onClick={() => decide(entry.teaching.id, "accepted")}\n''','''            <p className="si-hint mt-2 text-xs">Accepting this teaching approves source doctrine only. It does not create personal outcome evidence or accept any derived objection mapping; mappings remain independently reviewed in C. REVIEW QUEUE.</p>\n            <div className="mt-3 flex flex-wrap gap-2">\n              <Button\n                size="sm"\n                disabled={review.isPending}\n                onClick={() => decide(entry.teaching.id, "accepted")}\n''')

          Path('shared/goldlineAnalyticsClosure.test.ts').write_text('''import {describe,expect,it} from "vitest";import {GOLDLINE_CLIENT_EVENT_NAMES,sanitizeDayforgeProductEventProperties} from "./dayforgeEvents";describe("Goldline analytics closure",()=>{it("allows privacy-safe target start",()=>{expect(GOLDLINE_CLIENT_EVENT_NAMES).toContain("cold_call_target_started");expect(sanitizeDayforgeProductEventProperties("cold_call_target_started",{sessionId:"s",phone:"secret"})).toEqual({sessionId:"s"})});it("cannot fabricate trusted outcomes",()=>{for(const e of ["account_won","visit_completed","follow_up_created"])expect(GOLDLINE_CLIENT_EVENT_NAMES).not.toContain(e)})});\n''')
          Path('client/src/pages/SalesIntelAdmin.review-contract.test.ts').write_text('''import {readFileSync} from "node:fs";import {describe,expect,it} from "vitest";const s=readFileSync(new URL("./SalesIntelAdmin.tsx",import.meta.url),"utf8");describe("review UX",()=>{it("is human gated and provenance explicit",()=>{expect(s).not.toContain("High-confidence extractions are accepted automatically");for(const x of ["EXACT SOURCE","PARAPHRASE","WHEN TO USE:","WHEN NOT TO USE:","Model extraction confidence","does not create personal outcome evidence","mappings remain independently reviewed"])expect(s).toContain(x)})});\n''')
          Path('server/salesIntel/armoryDoctrineGate.integration.test.ts').write_text('''import {randomUUID} from "node:crypto";import {inArray} from "drizzle-orm";import {afterAll,describe,expect,it} from "vitest";import {salesIntelFrameworks,salesIntelSourceArtifacts} from "../../drizzle/schema";import {getDb} from "../db";import {countIndependentSourceSupport,persistFrameworkVersion,upsertSourceArtifact} from "./salesIntelStore";const run=process.env.DAYFORGE_RELEASE_DB==="1"&&!!process.env.DATABASE_URL,ids:string[]=[];async function src(status:"extracted"|"analyzed"="extracted"){const t=randomUUID();const {artifact}=await upsertSourceArtifact({contentHash:`d-${t}`,sourceType:"youtube",sourceUrl:`https://x/${t}`,canonicalUrl:`https://x/${t}`,externalContentId:t,creatorName:"C",creatorHandle:null,publishedAt:null,title:"T",metadata:{},ingestedBy:"test",status});ids.push(artifact.id);return artifact}async function fw(sourceArtifactId:string,reviewState:"accepted"|"review_required"|"rejected",active=true){const row=await persistFrameworkVersion({frameworkKey:randomUUID().replaceAll("-",""),sourceArtifactId,transcriptId:null,creatorName:"C",creatorHandle:null,archetype:"ANCHOR",channel:"phone",exactObjection:"x",diagnosis:null,frameworkName:"F",principle:"p",responseFamily:"isolate_constraint",discoveryQuestions:[],exampleLanguage:[],whenToUse:[],whenNotToUse:[],followUpMoves:[],badResponses:[],confidence:.9,extractionVersion:"v",extractionProvider:"f",extractionModel:"f",promptVersion:"v",transcriptStartMs:null,transcriptEndMs:null,reviewState});if(!active){const db=await getDb();if(!db)throw Error("db");await db.update(salesIntelFrameworks).set({active:false}).where(inArray(salesIntelFrameworks.id,[row.id]))}}describe.skipIf(!run)("doctrine gate",()=>{afterAll(async()=>{const db=await getDb();if(!db)return;await db.delete(salesIntelFrameworks).where(inArray(salesIntelFrameworks.sourceArtifactId,ids));await db.delete(salesIntelSourceArtifacts).where(inArray(salesIntelSourceArtifacts.id,ids))});it("counts only independent accepted active extracted real sources",async()=>{const primary=await src(),a=await src(),p=await src(),r=await src(),n=await src("analyzed"),i=await src();await fw(a.id,"accepted");await fw(p.id,"review_required");await fw(r.id,"rejected");await fw(n.id,"accepted");await fw(i.id,"accepted",false);await fw(primary.id,"accepted");expect(await countIndependentSourceSupport({frameworkId:"unused",sourceArtifactId:primary.id,archetype:"ANCHOR",channel:"phone",responseFamily:"isolate_constraint"})).toBe(1)})});\n''')
          PY
      - run: pnpm vitest run shared/goldlineAnalyticsClosure.test.ts client/src/pages/SalesIntelAdmin.review-contract.test.ts
      - run: pnpm db:dayforge:release
      - run: pnpm vitest run --config vitest.integration.config.ts server/salesIntel/armoryDoctrineGate.integration.test.ts
      - run: pnpm build
      - run: node scripts/checkGoldlineBundleBudget.mjs
      - run: git diff --check
      - name: Commit code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/dayforgeEvents.ts shared/goldlineAnalyticsClosure.test.ts client/src/game/GoldlineGameHome.tsx client/src/pages/GoldlineEffectivenessAdmin.tsx client/src/pages/SalesIntelAdmin.tsx client/src/pages/SalesIntelAdmin.review-contract.test.ts server/dayforgeEvents/goldlineEffectivenessQueries.ts server/salesIntel/salesIntelStore.ts server/salesIntel/armoryDoctrineGate.integration.test.ts
          git commit -m "goldline: close analytics doctrine and review gates"
          git push origin HEAD:feature/goldline-growth-loop-hardening
