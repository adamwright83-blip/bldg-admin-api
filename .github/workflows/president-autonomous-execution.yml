name: President autonomous execution

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  execute-approved-president-mission:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    concurrency:
      group: president-autonomous-execution-${{ matrix.slot }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Run one Adam-approved President mission
        env:
          GH_TOKEN: ${{ github.token }}
          PRESIDENT_EXECUTION_API: https://admin.bldg.chat/api/president/autonomous/github
        run: pnpm exec tsx scripts/president-github-actions-executor.ts
