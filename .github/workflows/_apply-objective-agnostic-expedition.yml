name: Apply objective-agnostic expedition patch

on:
  push:
    branches:
      - agent/goldline-objective-agnostic-expedition

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/goldline-objective-agnostic-expedition
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply focused patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          objective = Path("client/src/game/expedition/expeditionObjective.ts")
          objective.write_text(r'''import type { Order } from "@shared/types";
          import type { OpenChannelMission } from "../../../../server/openChannel/openChannelTypes";

          export type NativePickupExpeditionObjective = {
            kind: "native_pickup";
            key: string;
            planSeed: number;
            label: string;
            detail: string;
            orderId: number;
          };

          export type OpenChannelExpeditionObjective = {
            kind: "open_channel";
            key: string;
            planSeed: number;
            label: string;
            detail: string;
            missionId: string;
            taskId: string;
          };

          export type PreparedExpeditionObjective =
            | NativePickupExpeditionObjective
            | OpenChannelExpeditionObjective;

          /**
           * Deterministic fictional seed. It may vary expedition dressing but
           * can never create, erase, or resolve business truth.
           */
          export function stableObjectiveSeed(key: string): number {
            let hash = 2166136261;
            for (let index = 0; index < key.length; index += 1) {
              hash ^= key.charCodeAt(index);
              hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0) || 1;
          }

          /**
           * One truthful bridge into the expedition shell.
           *
           * Native pickup keeps priority when one is genuinely due. Otherwise
           * the first pending, human-approved Open Channel task becomes the
           * expedition objective. No task is invented here and completed tasks
           * can never re-enter the run.
           */
          export function prepareExpeditionObjective(input: {
            pickup: Order | null;
            openChannelMission: OpenChannelMission | null;
          }): PreparedExpeditionObjective | null {
            const pickupAddress = input.pickup?.address?.trim();
            if (input.pickup && pickupAddress) {
              const key = `pickup:${input.pickup.id}`;
              return {
                kind: "native_pickup",
                key,
                planSeed: stableObjectiveSeed(key),
                label:
                  `${input.pickup.firstName ?? ""} ${input.pickup.lastName ?? ""}`.trim() ||
                  `Order #${input.pickup.id}`,
                detail: pickupAddress,
                orderId: input.pickup.id,
              };
            }

            if (input.openChannelMission?.status !== "active") return null;
            const task = input.openChannelMission.tasks.find(
              candidate => candidate.status === "pending"
            );
            if (!task) return null;

            const key = `open-channel:${input.openChannelMission.id}:${task.id}`;
            return {
              kind: "open_channel",
              key,
              planSeed: stableObjectiveSeed(key),
              label: task.title,
              detail: task.detail,
              missionId: input.openChannelMission.id,
              taskId: task.id,
            };
          }
          '''.replace("          ", ""))

          test = Path("client/src/game/expedition/expeditionObjective.test.ts")
          test.write_text(r'''import { describe, expect, it } from "vitest";
          import type { Order } from "@shared/types";
          import type { OpenChannelMission } from "../../../../server/openChannel/openChannelTypes";
          import {
            prepareExpeditionObjective,
            stableObjectiveSeed,
          } from "./expeditionObjective";

          const pickup = {
            id: 42,
            firstName: "Ada",
            lastName: "Lovelace",
            address: "1 Gold Line",
          } as Order;

          const mission: OpenChannelMission = {
            id: "day-1",
            businessDate: "2026-08-16",
            status: "active",
            title: "Open the day",
            operatorBriefing: "Real work",
            transcript: "Real work",
            generationSource: "deterministic_fallback",
            gapStartedAt: "2026-08-16T08:00:00.000Z",
            nextCommitmentAt: null,
            availableMinutes: 120,
            tasks: [
              {
                id: "task-1",
                position: 1,
                title: "Forge the message",
                detail: "Finish the door hanger",
                estimatedMinutes: 30,
                category: "sales",
                navigationQuery: null,
                status: "pending",
                completedAt: null,
              },
            ],
            approvedAt: "2026-08-16T08:01:00.000Z",
            completedAt: null,
          };

          describe("prepareExpeditionObjective", () => {
            it("keeps a genuine native pickup as the first expedition objective", () => {
              const objective = prepareExpeditionObjective({
                pickup,
                openChannelMission: mission,
              });
              expect(objective).toMatchObject({
                kind: "native_pickup",
                orderId: 42,
                label: "Ada Lovelace",
              });
            });

            it("promotes the first pending approved Open Channel task when no pickup exists", () => {
              const objective = prepareExpeditionObjective({
                pickup: null,
                openChannelMission: mission,
              });
              expect(objective).toMatchObject({
                kind: "open_channel",
                missionId: "day-1",
                taskId: "task-1",
                label: "Forge the message",
                detail: "Finish the door hanger",
              });
            });

            it("never replays a completed Open Channel task", () => {
              const objective = prepareExpeditionObjective({
                pickup: null,
                openChannelMission: {
                  ...mission,
                  tasks: mission.tasks.map(task => ({
                    ...task,
                    status: "completed" as const,
                    completedAt: "2026-08-16T09:00:00.000Z",
                  })),
                },
              });
              expect(objective).toBeNull();
            });

            it("uses a stable nonzero fictional seed", () => {
              expect(stableObjectiveSeed("open-channel:day-1:task-1")).toBe(
                stableObjectiveSeed("open-channel:day-1:task-1")
              );
              expect(stableObjectiveSeed("open-channel:day-1:task-1")).toBeGreaterThan(0);
            });
          });
          '''.replace("          ", ""))

          p = Path("client/src/game/GoldlineGameHome.tsx")
          text = p.read_text()

          text = replace_once(
              text,
              'import { planPickupExpedition } from "./expedition/expeditionPlan";\n',
              'import { planPickupExpedition } from "./expedition/expeditionPlan";\nimport {\n  prepareExpeditionObjective,\n  type PreparedExpeditionObjective,\n} from "./expedition/expeditionObjective";\n',
              "objective import",
          )

          anchor = '''  const nextOrderObjective =\n    orderObjectives.find(item => item.order.address?.trim()) ?? null;\n'''
          addition = anchor + '''  // The expedition shell is driven by a truthful operational objective, not\n  // by the presence of a Laundry Butler-native pickup alone. Native pickup\n  // keeps priority; otherwise the first pending, human-approved Open Channel\n  // task becomes playable. Fiction never invents work here.\n  const preparedObjective = useMemo(\n    () =>\n      prepareExpeditionObjective({\n        pickup:\n          nextOrderObjective && nextOrderObjective.status !== "delivered"\n            ? nextOrderObjective.order\n            : null,\n        openChannelMission: props.openChannelMission ?? null,\n      }),\n    [nextOrderObjective, props.openChannelMission]\n  );\n'''
          text = replace_once(text, anchor, addition, "prepared objective")

          old = '''  /**\n   * A genuine PICKUP objective PREPARES an expedition. It does not start\n   * one. Manual combat never begins merely because the app has a pickup —\n   * the player crosses the threshold explicitly (see ExpeditionHud). This\n   * is the parked-play contract, not a cosmetic gate.\n   */\n  const preparedPickupOrderId =\n    nextOrderObjective && nextOrderObjective.status !== "delivered"\n      ? nextOrderObjective.order.id\n      : null;\n\n'''
          new = '''  /**\n   * A truthful operational objective PREPARES an expedition. It does not\n   * start one. The player crosses the threshold explicitly; whether the\n   * climax resolves a native pickup or an approved Open Channel task is\n   * decided only by that objective's canonical adapter.\n   */\n\n'''
          text = replace_once(text, old, new, "remove pickup-only gate")

          start = text.index('  type ActivePickupExpedition = {')
          end = text.index('  /**\n   * AUTHORITATIVE collected truth', start)
          replacement = '''  type ActiveExpedition = PreparedExpeditionObjective & {\n    /**\n     * Pickup-only Stronghold BEFORE reading. Open Channel work deliberately\n     * carries no restoration snapshot because completing effort is not an\n     * economic/fulfillment pickup win.\n     */\n    restorationBefore: StrongholdRestoration | null;\n  };\n  const [activeExpedition, setActiveExpedition] =\n    useState<ActiveExpedition | null>(null);\n\n'''
          text = text[:start] + replacement + text[end:]

          old = '''  const restorationNow = useMemo(\n    () =>\n      projectStrongholdRestoration({\n        orders: collectedOrderEvidence,\n        expeditionOrderId: activeExpedition?.orderId ?? null,\n      }),\n    [collectedOrderEvidence, activeExpedition?.orderId]\n  );\n\n  const enterExpedition = useCallback(() => {\n    if (!nextOrderObjective || preparedPickupOrderId == null) return;\n    const order = nextOrderObjective.order;\n    setExpeditionSnapshot({\n      hp: EXPEDITION.maxHp,\n      momentum: 0,\n      outcome: "running",\n      route: "unchosen",\n      relic: null,\n    });\n    setActiveExpedition({\n      orderId: order.id,\n      customerLabel:\n        `${order.firstName ?? ""} ${order.lastName ?? ""}`.trim() ||\n        `Order #${order.id}`,\n      address: (order.address ?? "").trim(),\n      restorationBefore: projectStrongholdRestoration({\n        orders: collectedOrderEvidence,\n        expeditionOrderId: order.id,\n      }),\n    });\n  }, [nextOrderObjective, preparedPickupOrderId, collectedOrderEvidence]);\n'''
          new = '''  const restorationNow = useMemo(\n    () =>\n      projectStrongholdRestoration({\n        orders: collectedOrderEvidence,\n        expeditionOrderId:\n          activeExpedition?.kind === "native_pickup"\n            ? activeExpedition.orderId\n            : null,\n      }),\n    [collectedOrderEvidence, activeExpedition]\n  );\n\n  const enterExpedition = useCallback(() => {\n    if (!preparedObjective) return;\n    setExpeditionSnapshot({\n      hp: EXPEDITION.maxHp,\n      momentum: 0,\n      outcome: "running",\n      route: "unchosen",\n      relic: null,\n    });\n    setActiveExpedition({\n      ...preparedObjective,\n      restorationBefore:\n        preparedObjective.kind === "native_pickup"\n          ? projectStrongholdRestoration({\n              orders: collectedOrderEvidence,\n              expeditionOrderId: preparedObjective.orderId,\n            })\n          : null,\n    });\n  }, [preparedObjective, collectedOrderEvidence]);\n'''
          text = replace_once(text, old, new, "generic enter")

          old = '''  const pinnedOrderCollected = restorationNow.expeditionOrderCollected;\n\n  /** The honest before/after, both derived from real evidence. */\n  const payoffDelta = useMemo(\n    () =>\n      activeExpedition\n        ? restorationDelta(activeExpedition.restorationBefore, restorationNow)\n        : null,\n    [activeExpedition, restorationNow]\n  );\n'''
          new = '''  const pinnedOrderCollected =\n    activeExpedition?.kind === "native_pickup" &&\n    restorationNow.expeditionOrderCollected;\n  const pinnedOpenChannelTaskCompleted =\n    activeExpedition?.kind === "open_channel" &&\n    props.openChannelMission?.id === activeExpedition.missionId &&\n    props.openChannelMission.tasks.some(\n      task =>\n        task.id === activeExpedition.taskId && task.status === "completed"\n    );\n  const objectiveConfirmed = Boolean(\n    activeExpedition?.kind === "native_pickup"\n      ? pinnedOrderCollected\n      : activeExpedition?.kind === "open_channel"\n        ? pinnedOpenChannelTaskCompleted\n        : false\n  );\n\n  /** The honest pickup before/after, both derived from real evidence. */\n  const payoffDelta = useMemo(\n    () =>\n      activeExpedition?.kind === "native_pickup" &&\n      activeExpedition.restorationBefore\n        ? restorationDelta(activeExpedition.restorationBefore, restorationNow)\n        : null,\n    [activeExpedition, restorationNow]\n  );\n'''
          text = replace_once(text, old, new, "objective confirmation")

          old_start = text.index('  const secureCargo = useCallback(async () => {')
          old_end = text.index('  /**\n   * The payoff fires from AUTHORITATIVE EVIDENCE', old_start)
          new_block = '''  const completeExpeditionObjective = useCallback(async () => {\n    if (!activeExpedition) return;\n    if (cargoPhase === "verifying") return;\n    setCargoPhase("verifying");\n    try {\n      const ok =\n        activeExpedition.kind === "native_pickup"\n          ? await props.actionServices.resolveOrder({\n              orderId: activeExpedition.orderId,\n              status: "collected",\n            })\n          : await props.onCompleteOpenChannelTask(\n              activeExpedition.missionId,\n              activeExpedition.taskId\n            );\n      // The adapter returning only means its canonical write was accepted.\n      // The HUD remains VERIFYING until the corresponding authoritative query\n      // reports the pinned objective resolved.\n      if (!ok) setCargoPhase("failed");\n    } catch {\n      setCargoPhase("failed");\n    }\n  }, [\n    activeExpedition,\n    cargoPhase,\n    props.actionServices,\n    props.onCompleteOpenChannelTask,\n  ]);\n\n'''
          text = text[:old_start] + new_block + text[old_end:]

          old_start = text.index('  const payoffFiredForOrderRef = useRef<number | null>(null);')
          old_end = text.index('  /**\n   * The persistent physical payoff', old_start)
          new_block = '''  const payoffFiredForObjectiveRef = useRef<string | null>(null);\n  useEffect(() => {\n    if (!activeExpedition || !objectiveConfirmed) return;\n    if (payoffFiredForObjectiveRef.current === activeExpedition.key) return;\n    payoffFiredForObjectiveRef.current = activeExpedition.key;\n\n    // Server-verified feedback. For Open Channel this means the persisted\n    // task is completed; it does NOT imply a customer, revenue, or pickup.\n    getAudioManager().play("captured_truth");\n    arcadeFeedback();\n    runtimeRef.current?.finishExpeditionAtStronghold();\n  }, [activeExpedition, objectiveConfirmed]);\n\n  useEffect(() => {\n    if (activeExpedition == null) payoffFiredForObjectiveRef.current = null;\n  }, [activeExpedition]);\n\n'''
          text = text[:old_start] + new_block + text[old_end:]

          old = '''  const pulsedForOrderRef = useRef<number | null>(null);\n  useEffect(() => {\n    if (!activeExpedition || !payoffDelta) return;\n    if (!payoffDelta.changed) return;\n    if (pulsedForOrderRef.current === activeExpedition.orderId) return;\n    pulsedForOrderRef.current = activeExpedition.orderId;\n    runtimeRef.current?.pulseStrongholdRestoration(payoffDelta);\n  }, [activeExpedition, payoffDelta]);\n'''
          new = '''  const pulsedForOrderRef = useRef<number | null>(null);\n  useEffect(() => {\n    if (activeExpedition?.kind !== "native_pickup" || !payoffDelta) return;\n    if (!payoffDelta.changed) return;\n    if (pulsedForOrderRef.current === activeExpedition.orderId) return;\n    pulsedForOrderRef.current = activeExpedition.orderId;\n    runtimeRef.current?.pulseStrongholdRestoration(payoffDelta);\n  }, [activeExpedition, payoffDelta]);\n'''
          text = replace_once(text, old, new, "pickup-only stronghold pulse")

          text = replace_once(
              text,
              '      planPickupExpedition({ orderId: activeExpedition.orderId }),',
              '      // The authored plan is fiction-only. A deterministic objective seed\n      // varies dressing without treating an Open Channel task as an order.\n      planPickupExpedition({ orderId: activeExpedition.planSeed }),',
              "plan seed",
          )
          text = replace_once(
              text,
              '  }, [activeExpedition?.orderId, runtimeReady]);',
              '  }, [activeExpedition?.key, runtimeReady]);',
              "runtime dependency",
          )

          text = replace_once(
              text,
              '''        activeExpedition != null\n          ? "active"\n          : preparedPickupOrderId != null\n            ? "ready"\n            : "none"''',
              '''        activeExpedition != null\n          ? "active"\n          : preparedObjective != null\n            ? "ready"\n            : "none"''',
              "data expedition state",
          )
          text = replace_once(
              text,
              '''        {(activeExpedition != null || preparedPickupOrderId != null) &&\n        runtimeReady ? (''',
              '''        {(activeExpedition != null || preparedObjective != null) &&\n        runtimeReady ? (''',
              "hud mount",
          )
          old = '''            objectiveLabel={\n              activeExpedition\n                ? activeExpedition.customerLabel\n                : nextOrderObjective\n                  ? `${nextOrderObjective.order.firstName ?? ""} ${\n                      nextOrderObjective.order.lastName ?? ""\n                    }`.trim() || `Order #${nextOrderObjective.order.id}`\n                  : ""\n            }'''
          new = '''            objectiveLabel={\n              activeExpedition?.label ?? preparedObjective?.label ?? ""\n            }'''
          text = replace_once(text, old, new, "hud objective label")
          text = replace_once(
              text,
              '            pinnedCustomer={activeExpedition?.customerLabel}\n            pinnedAddress={activeExpedition?.address}\n            onSecureCargo={secureCargo}\n            cargoPhase={cargoPhase}',
              '            pinnedCustomer={activeExpedition?.label}\n            pinnedAddress={activeExpedition?.detail}\n            onSecureCargo={completeExpeditionObjective}\n            cargoPhase={cargoPhase}\n            completionActionLabel={\n              activeExpedition?.kind === "open_channel" ? "SEAL THE WORK" : "SECURE CARGO"\n            }\n            confirmedLabel={\n              activeExpedition?.kind === "open_channel" ? "WORK SEALED" : "CARGO SECURED"\n            }\n            failedLabel={\n              activeExpedition?.kind === "open_channel"\n                ? "WORK NOT RECORDED — STILL PENDING"\n                : "PICKUP NOT RECORDED — STILL PENDING"\n            }',
              "hud generic completion",
          )
          text = replace_once(
              text,
              '            cargoSecured={pinnedOrderCollected}',
              '            cargoSecured={objectiveConfirmed}',
              "hud authoritative confirmation",
          )
          text = replace_once(
              text,
              '<b>{activeMission?.name ?? "NO ACTIVE MISSION"}</b>',
              '<b>{activeMission?.name ?? preparedObjective?.label ?? "NO ACTIVE MISSION"}</b>',
              "topbar objective",
          )
          text = replace_once(
              text,
              ') : activeMission || nextOrderObjective ? (',
              ') : activeMission || nextOrderObjective || preparedObjective ? (',
              "objective-ahead state",
          )
          text = replace_once(
              text,
              '          shouldAutoIgnite={!action && !activeMission && !nextOrderObjective}',
              '          shouldAutoIgnite={\n            !action && !activeMission && !nextOrderObjective && !preparedObjective\n          }',
              "open channel ignition",
          )
          p.write_text(text)

          hud = Path("client/src/game/expedition/ExpeditionHud.tsx")
          text = hud.read_text()
          text = replace_once(
              text,
              '  cargoSecured?: boolean;\n};',
              '  cargoSecured?: boolean;\n  completionActionLabel?: string;\n  confirmedLabel?: string;\n  verifyingLabel?: string;\n  failedLabel?: string;\n};',
              "hud copy props",
          )
          text = replace_once(
              text,
              '    cargoPhase = "idle",\n    cargoSecured = false,',
              '    cargoPhase = "idle",\n    cargoSecured = false,\n    completionActionLabel = "SECURE CARGO",\n    confirmedLabel = "CARGO SECURED",\n    verifyingLabel = "VERIFYING SERVER TRUTH",\n    failedLabel = "PICKUP NOT RECORDED — STILL PENDING",',
              "hud copy defaults",
          )
          text = replace_once(text, '              CARGO SECURED', '              {confirmedLabel}', "confirmed copy")
          text = replace_once(text, '              VERIFYING SERVER TRUTH', '              {verifyingLabel}', "verifying copy")
          text = replace_once(text, '                  PICKUP NOT RECORDED — STILL PENDING', '                  {failedLabel}', "failed copy")
          text = replace_once(text, '                SECURE CARGO', '                {completionActionLabel}', "action copy")
          hud.write_text(text)

          app = Path("client/src/App.tsx")
          text = app.read_text()
          marker = '''  const vendorSlug = isVendorHost\n    ? hostname.replace(".ops.bldg.chat", "")\n    : null;\n\n'''
          replacement = marker + '''  // driver.bldg.chat has one product URL: the root. Old bookmarks or\n  // accidental historical paths are collapsed invisibly back to /.\n  if (isDriverHost && window.location.pathname !== "/") {\n    return <Redirect to="/" />;\n  }\n\n'''
          text = replace_once(text, marker, replacement, "driver root canonicalization")
          app.write_text(text)

          # Remove this one-shot workflow from the resulting product commit.
          Path(".github/workflows/_apply-objective-agnostic-expedition.yml").unlink()
          PY

      - name: Focused expedition tests
        run: pnpm vitest run client/src/game/expedition

      - name: Production build
        run: pnpm build

      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Goldline: make expedition shell objective-agnostic"
          git push origin HEAD:agent/goldline-objective-agnostic-expedition
