name: Real Workday survey review fix

on:
  push:
    branches:
      - cursor/goldline-real-workday

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/goldline-real-workday
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic survey review fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Put SURVEY distance in the same corridor metric as combat.
          replace(
              "client/src/game/expedition/surveyPulse.ts",
              ' */\n\n/** Real ms the thumb must rest near centre before the pulse fires. */',
              ' */\n\nimport { LATERAL_TO_PROGRESS } from "./ruinbound";\n\n/** Real ms the thumb must rest near centre before the pulse fires. */',
          )
          replace(
              "client/src/game/expedition/surveyPulse.ts",
              'export const SURVEY_RADIUS = 520;',
              'export const SURVEY_RADIUS = 0.18;',
          )
          replace(
              "client/src/game/expedition/surveyPulse.ts",
              'distance: Math.hypot(candidate.x - originX, candidate.y - originY),',
              'distance: Math.hypot(\n        candidate.x - originX,\n        (candidate.y - originY) * LATERAL_TO_PROGRESS\n      ),',
          )

          # 2) Keep the unit tests in actual corridor units and explicitly prove
          # progress/lateral normalization.
          test = Path("client/src/game/expedition/surveyPulse.test.ts")
          text = test.read_text()
          text = text.replace(
              'import { describe, expect, it, vi } from "vitest";\n',
              'import { describe, expect, it, vi } from "vitest";\nimport { LATERAL_TO_PROGRESS } from "./ruinbound";\n',
              1,
          )
          text = text.replace('at(`h${i}`, (i + 1) * 10, 0)', 'at(`h${i}`, (i + 1) * 0.01, 0)')
          text = text.replace('[at("near", 10, 0), at("far", SURVEY_RADIUS + 1, 0)]', '[at("near", 0.03, 0), at("far", SURVEY_RADIUS + 0.01, 0)]')
          text = text.replace('[at("seen", 5, 0, { alreadyVisible: true }), at("hidden", 60, 0)]', '[at("seen", 0.01, 0, { alreadyVisible: true }), at("hidden", 0.06, 0)]')
          text = text.replace('[at("b", 0, 30), at("a", 30, 0)]', '[at("b", 0, 0.03 / LATERAL_TO_PROGRESS), at("a", 0.03, 0)]')
          text = text.replace('[at("a", 30, 0), at("b", 0, 30)]', '[at("a", 0.03, 0), at("b", 0, 0.03 / LATERAL_TO_PROGRESS)]')
          text = text.replace('resolveSurveyReveals([at("h", 10, 0)], 0, 0)', 'resolveSurveyReveals([at("h", 0.02, 0)], 0, 0)')
          text = text.replace('{ id: "hostile-7", kind: "hostile", x: 12, y: 4 }', '{ id: "hostile-7", kind: "hostile", x: 0.02, y: 4 }')
          text = text.replace('{ id: "a", kind: "hostile", x: 1, y: 0 },\n        { id: "b", kind: "hazard", x: 2, y: 0 },\n        { id: "c", kind: "anchor", x: 3, y: 0 },\n        { id: "d", kind: "opening", x: 4, y: 0 },', '{ id: "a", kind: "hostile", x: 0.01, y: 0 },\n        { id: "b", kind: "hazard", x: 0.02, y: 0 },\n        { id: "c", kind: "anchor", x: 0.03, y: 0 },\n        { id: "d", kind: "opening", x: 0.04, y: 0 },')
          marker = '''  it("drops subjects beyond the pulse radius", () => {\n'''
          proof = '''  it("normalizes authored lateral into the same metric as route progress", () => {\n    const sameProgressDistance = 0.04;\n    const reveals = resolveSurveyReveals(\n      [\n        at("ahead", sameProgressDistance, 0),\n        at("side", 0, sameProgressDistance / LATERAL_TO_PROGRESS),\n      ],\n      0,\n      0\n    );\n    expect(reveals).toHaveLength(2);\n    expect(reveals[0].distance).toBeCloseTo(reveals[1].distance, 6);\n  });\n\n'''
          if marker not in text:
              raise SystemExit("survey test insertion marker missing")
          text = text.replace(marker, proof + marker, 1)
          test.write_text(text)

          # 3) Never begin/complete a settle unless the runtime says the current
          # expedition is genuinely running. This prevents dead scans and a
          # cooldown being consumed in ordinary corridor exploration.
          replace(
              "client/src/game/GoldlineGameHome.tsx",
              '''      if (pulse.getPhase() === "settling") {\n        if (pulse.pointerUpdate(now, 0)) {\n          runtimeRef.current?.expeditionSurvey();\n        }\n        setSettleProgress(pulse.getSettleProgress(now));\n      }''',
              '''      if (pulse.getPhase() === "settling") {\n        const game = runtimeRef.current;\n        if (game?.getExpeditionSnapshot()?.outcome !== "running") {\n          pulse.cancel();\n          setSettleProgress(0);\n        } else {\n          if (pulse.pointerUpdate(now, 0)) game.expeditionSurvey();\n          setSettleProgress(pulse.getSettleProgress(now));\n        }\n      }''',
          )
          replace(
              "client/src/game/GoldlineGameHome.tsx",
              '''              onPressStart={deflection => {\n                surveyPulseRef.current.pointerDown(\n                  performance.now(),\n                  deflection\n                );\n                setSettleProgress(0);\n              }}\n              onPressUpdate={deflection => {\n                const now = performance.now();\n                if (surveyPulseRef.current.pointerUpdate(now, deflection)) {\n                  runtimeRef.current?.expeditionSurvey();\n                }\n                setSettleProgress(\n                  surveyPulseRef.current.getSettleProgress(now)\n                );\n              }}''',
              '''              onPressStart={deflection => {\n                const game = runtimeRef.current;\n                if (game?.getExpeditionSnapshot()?.outcome !== "running") {\n                  surveyPulseRef.current.cancel();\n                  setSettleProgress(0);\n                  return;\n                }\n                surveyPulseRef.current.pointerDown(\n                  performance.now(),\n                  deflection\n                );\n                setSettleProgress(0);\n              }}\n              onPressUpdate={deflection => {\n                const game = runtimeRef.current;\n                if (game?.getExpeditionSnapshot()?.outcome !== "running") {\n                  surveyPulseRef.current.cancel();\n                  setSettleProgress(0);\n                  return;\n                }\n                const now = performance.now();\n                if (surveyPulseRef.current.pointerUpdate(now, deflection)) {\n                  game.expeditionSurvey();\n                }\n                setSettleProgress(\n                  surveyPulseRef.current.getSettleProgress(now)\n                );\n              }}''',
          )

          # 4) Actually render the resolved reveals in Pixi. Rendering is a
          # read-only game projection: it never writes business state.
          replace(
              "client/src/game/runtime/GoldlineGame.ts",
              '''import {\n  resolveSurveyReveals,\n  stepSurveyReveals,\n  type SurveyReveal,\n} from "../expedition/surveyPulse";''',
              '''import {\n  resolveSurveyReveals,\n  stepSurveyReveals,\n  SURVEY_REVEAL_SECONDS,\n  type SurveyReveal,\n} from "../expedition/surveyPulse";''',
          )
          replace(
              "client/src/game/runtime/GoldlineGame.ts",
              '''  private strongholdRestoration: StrongholdRestoration | null = null;\n  private gRestoration = new Graphics();''',
              '''  private strongholdRestoration: StrongholdRestoration | null = null;\n  private gRestoration = new Graphics();\n  /** Read-only L4 projection of currently active fictional SURVEY reveals. */\n  private gSurvey = new Graphics();''',
          )
          replace(
              "client/src/game/runtime/GoldlineGame.ts",
              '''      if (effectsTexture) {\n        this.effectsSprite = new Sprite(effectsTexture);\n        this.effectsSprite.alpha = 0.4;\n        this.layerEffects.addChild(this.effectsSprite);\n      }\n\n      const portalTexture = optionalTextures.get("portal");''',
              '''      if (effectsTexture) {\n        this.effectsSprite = new Sprite(effectsTexture);\n        this.effectsSprite.alpha = 0.4;\n        this.layerEffects.addChild(this.effectsSprite);\n      }\n      this.gSurvey.label = "survey-reveals";\n      this.layerEffects.addChild(this.gSurvey);\n\n      const portalTexture = optionalTextures.get("portal");''',
          )
          replace(
              "client/src/game/runtime/GoldlineGame.ts",
              '''    this.expeditionCallbacks = {};\n    this.expeditionDrivingMovement = false;\n    this.populationSystem?.setExpeditionPresentation(false);''',
              '''    this.expeditionCallbacks = {};\n    this.expeditionDrivingMovement = false;\n    this.surveyReveals = [];\n    this.gSurvey.clear();\n    this.populationSystem?.setExpeditionPresentation(false);''',
          )
          replace(
              "client/src/game/runtime/GoldlineGame.ts",
              '''  /** Currently-lit survey reveals, aged by the main update loop. */\n  getSurveyReveals(): readonly SurveyReveal[] {\n    return this.surveyReveals;\n  }\n\n  isDodging(): boolean {''',
              '''  /** Currently-lit survey reveals, aged by the main update loop. */\n  getSurveyReveals(): readonly SurveyReveal[] {\n    return this.surveyReveals;\n  }\n\n  /**\n   * Draw the information SURVEY actually bought. Subjects are re-resolved by\n   * opaque fictional id each frame so a moving guardian's marker follows the\n   * guardian instead of becoming a stale world-space decal. A dead/removed\n   * subject simply disappears. This is presentation only.\n   */\n  private drawSurveyReveals(width: number, height: number) {\n    const g = this.gSurvey;\n    g.clear();\n    if (!this.expedition || this.surveyReveals.length === 0) return;\n\n    const live = new Map(\n      this.expedition.getSurveyCandidates().map(candidate => [candidate.id, candidate])\n    );\n    for (const reveal of this.surveyReveals) {\n      const subject = live.get(reveal.id);\n      if (!subject) continue;\n      const at = this.projectCorridor(subject.x, subject.y, width, height);\n      const life = Math.max(0, Math.min(1, reveal.remaining / SURVEY_REVEAL_SECONDS));\n      const age = 1 - life;\n      const lift = subject.kind === "hostile" ? 44 * at.scale : 18 * at.scale;\n      const radius = (18 + age * 15) * at.scale;\n      const color =\n        subject.kind === "hazard"\n          ? 0xf4633a\n          : subject.kind === "hostile"\n            ? 0xffd98a\n            : 0xffd166;\n      const x = at.x;\n      const y = at.y - lift;\n\n      // Dark under-ring preserves readability over the bright city plate;\n      // the gold/danger ring is the actual short-lived reveal.\n      g.circle(x, y, radius + 3 * at.scale).stroke({\n        width: 5 * at.scale,\n        color: 0x071119,\n        alpha: 0.42 * life,\n      });\n      g.circle(x, y, radius).stroke({\n        width: 3 * at.scale,\n        color,\n        alpha: 0.92 * life,\n      });\n      g.circle(x, y, 4.5 * at.scale).fill({ color, alpha: 0.72 * life });\n    }\n  }\n\n  isDodging(): boolean {''',
          )
          replace(
              "client/src/game/runtime/GoldlineGame.ts",
              '''      this.expedition.update(\n        deltaSeconds,\n        this.progress,\n        this.lateral * 140,\n        (progress, lateral) => this.projectCorridor(progress, lateral, width, height),\n        width\n      );\n\n      // The fiction contributes movement in SCREEN space; convert it back''',
              '''      this.expedition.update(\n        deltaSeconds,\n        this.progress,\n        this.lateral * 140,\n        (progress, lateral) => this.projectCorridor(progress, lateral, width, height),\n        width\n      );\n      this.drawSurveyReveals(width, height);\n\n      // The fiction contributes movement in SCREEN space; convert it back''',
          )

          # One-shot workflow: remove itself from the resulting fix commit.
          Path(".github/workflows/real-workday-survey-review-fix.yml").unlink()
          PY
      - name: Targeted SURVEY tests
        run: pnpm vitest run client/src/game/expedition/surveyPulse.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit fixes to the feature branch
        shell: bash
        run: |
          git config user.name "goldline-review-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make SURVEY visible, spatially correct, and expedition-only"
          git push origin HEAD:cursor/goldline-real-workday
