name: Goldline production hotfix patcher

on:
  push:
    branches:
      - agent/goldline-production-ignition-voice-hotfix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/goldline-production-ignition-voice-hotfix
          fetch-depth: 0
      - name: Apply narrow production fixes
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[hotfix-applied\]'; then
            exit 0
          fi
          python3 scripts/apply-goldline-production-hotfix.py
          git diff --check
          git config user.name "Goldline Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/zz-goldline-production-hotfix-patcher.yml
          rm scripts/apply-goldline-production-hotfix.py
          git add -A
          git commit -m "fix(goldline): production ignition and voice resilience [hotfix-applied]"
          git push origin HEAD:agent/goldline-production-ignition-voice-hotfix
