              '          prompt:\n            "Transcribe an operator\'s field briefing. Preserve places, people, amounts, time constraints, errands, and sales tasks accurately.",\n          mimeType: audio.mimeType,\n          fileName: `briefing.${audioFileExtension(audio.mimeType)}`,\n        });\n'
