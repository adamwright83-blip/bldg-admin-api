name: Nomenclature semantic hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same pull request supersedes this run. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nomenclature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject ambiguous retired product naming
        run: node scripts/check-nomenclature.mjs
      - name: Prevent new implicit default-tenant fallbacks
        env:
          DEFAULT_TENANT_RATCHET_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-default-tenant-ratchet.mjs
      - name: Enforce vertical dependency direction
        run: node scripts/check-vertical-dependencies.mjs
      - name: Prevent new cross-domain dependency violations
        env:
          DOMAIN_BOUNDARY_RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-domain-boundaries.mjs
      - name: Verify domain-boundary and default-tenant ratchet tests
        run: node --test scripts/check-domain-boundaries.test.mjs scripts/check-default-tenant-ratchet.test.mjs

