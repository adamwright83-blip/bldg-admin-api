name: Nomenclature semantic hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  nomenclature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject ambiguous retired product naming
        run: node scripts/check-nomenclature.mjs
