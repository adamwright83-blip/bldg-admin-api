# LEGACY DAYFORGE COMPATIBILITY: retained historical literal only; not current architecture.
name: Claire conversation integrity (isolated verification)
# Pushes run only the deterministic, no-cost checks. Real-model replays spend Anthropic credit
# (one full set of three suites is roughly 120 Sonnet calls), so they run only when someone
# starts this workflow by hand with run_paid_model_replays=true. 2026-10-16: an automatic run on
# every push, plus repeated local replays, spent about $10 in one session.
on:
  push:
    branches: [codex/claire-repair-verification, claude/claire-work-ledger]
  workflow_dispatch:
    inputs:
      run_paid_model_replays:
        description: "Run the real-model replays (spends Anthropic credit). Type true to authorize."
        required: true
        default: "false"
permissions:
  contents: read
jobs:
  disposable-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.run_paid_model_replays == 'true' && '["database","live-model"]' || '["database"]') }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: claire_repair_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:test-only@127.0.0.1:3306/claire_repair_test
      DAYFORGE_RELEASE_DB: '1'
      DAYFORGE_RELEASE_TEST_MODE: '1'
      CLAIRE_REPAIR_DB_TEST: '1'
      NODE_ENV: ci
      # Separate, spend-capped testing workspace key; never the production key.
      ANTHROPIC_API_KEY: ${{ matrix.mode == 'live-model' && secrets.CLAIRE_TEST_ANTHROPIC_API_KEY || '' }}
      CLAIRE_PAID_REPLAY_AUTHORIZED: ${{ matrix.mode == 'live-model' && '1' || '' }}
      CLAIRE_REPLAY_KEY_IS_TESTING: ${{ matrix.mode == 'live-model' && '1' || '' }}
    steps:
      - name: Require actual model access for the live replay
        if: matrix.mode == 'live-model'
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo '::error::BLOCKED: add CLAIRE_TEST_ANTHROPIC_API_KEY (capped testing workspace key) as a repository Actions secret. No mock was substituted.'
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Bootstrap the disposable database using the production schema authority
        run: node scripts/migrate.mjs
      - name: Real writes, independent reads, fresh state stores and failed-readback retries
        run: pnpm vitest run --config vitest.integration.config.ts server/claire/briefing/conversationIntegrity.mysql.integration.test.ts --minWorkers=1 --maxWorkers=1
      - name: Scheduled calls and simulated phone transport
        env:
          DATABASE_URL: ''
          ANTHROPIC_API_KEY: ''
        run: pnpm vitest run server/claire/showrunner/scheduledConversation.test.ts server/claire/showrunner/showrunnerTurnSafety.test.ts server/claire/workLedger/workLedger.test.ts server/claire/weeklyMission/deskCommsLedger.test.ts shared/weeklyMissionReadiness.test.ts server/claire/voice server/claire/briefing --minWorkers=1 --maxWorkers=2
      - name: Actual model conversation replay against disposable MySQL
        if: matrix.mode == 'live-model'
        env:
          CLAIRE_REPAIR_LIVE_MODEL: '1'
        run: pnpm vitest run --config vitest.integration.config.ts server/claire/briefing/conversationIntegrity.live.integration.test.ts --minWorkers=1 --maxWorkers=1
      - name: Work ledger — real-model replay of the 2026-10-15 call, PR 599 and evening scenarios
        if: ${{ !cancelled() && matrix.mode == 'live-model' }}
        env:
          DATABASE_URL: ''
          CLAIRE_WORK_LEDGER: '1'
          CLAIRE_WORK_LEDGER_LIVE: '1'
        run: pnpm vitest run server/claire/workLedger/workLedger.live.test.ts --minWorkers=1 --maxWorkers=1
      - name: Work ledger — production Relay turn path, real models, disposable MySQL
        if: ${{ !cancelled() && matrix.mode == 'live-model' }}
        env:
          CLAIRE_WORK_LEDGER: '1'
          CLAIRE_WORK_LEDGER_LIVE: '1'
          # Claire call tokens are signed; a disposable value for this job only.
          JWT_SECRET: claire-work-ledger-ci-disposable-000000000000000000000
        run: pnpm vitest run --config vitest.integration.config.ts server/claire/workLedger/workLedgerCall.live.integration.test.ts --minWorkers=1 --maxWorkers=1
