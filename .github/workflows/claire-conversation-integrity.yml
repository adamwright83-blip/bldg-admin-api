name: Claire conversation integrity (isolated verification)
on:
  push:
    branches: [codex/claire-repair-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [database, live-model]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: claire_repair_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:test-only@127.0.0.1:3306/claire_repair_test
      DAYFORGE_RELEASE_DB: '1'
      DAYFORGE_RELEASE_TEST_MODE: '1'
      CLAIRE_REPAIR_DB_TEST: '1'
      NODE_ENV: ci
      ANTHROPIC_API_KEY: ${{ matrix.mode == 'live-model' && secrets.ANTHROPIC_API_KEY || '' }}
    steps:
      - name: Require actual model access for the live replay
        if: matrix.mode == 'live-model'
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo '::error::BLOCKED: add ANTHROPIC_API_KEY as a repository Actions secret for actual model verification. No mock was substituted.'
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:legacy-dayforge:release
      - name: Real writes, independent reads, fresh state stores and failed-readback retries
        run: pnpm vitest run --config vitest.integration.config.ts server/claire/briefing/conversationIntegrity.mysql.integration.test.ts --minWorkers=1 --maxWorkers=1
      - name: Scheduled calls and simulated phone transport
        env:
          DATABASE_URL: ''
          ANTHROPIC_API_KEY: ''
        run: pnpm vitest run server/claire/showrunner/scheduledConversation.test.ts server/claire/showrunner/showrunnerTurnSafety.test.ts server/claire/voice server/claire/briefing --minWorkers=1 --maxWorkers=2
      - name: Actual model conversation replay against disposable MySQL
        if: matrix.mode == 'live-model'
        env:
          CLAIRE_REPAIR_LIVE_MODEL: '1'
        run: pnpm vitest run --config vitest.integration.config.ts server/claire/briefing/conversationIntegrity.live.integration.test.ts --minWorkers=1 --maxWorkers=1
