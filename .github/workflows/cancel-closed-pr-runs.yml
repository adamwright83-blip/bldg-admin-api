name: Cancel runs of a closed pull request

# A merged or closed pull request's checks no longer gate anything, but its
# in-flight runs keep holding runners that open pull requests are queued for.
# Only pull_request runs for this PR's head commit(s) are cancelled; runs on main
# (including the merge commit's own push runs) are untouched.
on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Fork pull requests get a read-only token; their runs cannot be cancelled from here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Cancel this pull request's queued and running workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for status in queued in_progress waiting pending requested; do
            gh api "repos/$REPO/actions/runs?branch=$BRANCH&event=pull_request&status=$status&per_page=100" \
              --jq '.workflow_runs[].id'
          done | sort -u | while read -r id; do
            [ "$id" = "$SELF" ] && continue
            gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null && echo "cancelled $id" || echo "could not cancel $id"
          done
