name: Legacy reference normalization

on:
  push:
    branches:
      - chatgpt/legacy-dayforge-semantic-hygiene-0924

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[legacy-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize repeated legacy prefixes
        run: node scripts/normalize-retired-name.mjs
      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goldline Naming Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: normalize legacy naming references [legacy-normalized]"
          git push origin HEAD:${GITHUB_REF_NAME}
