name: Lantern City Experimental Mosaic (manual, non-shipping)

# IMPORTANT: This renderer is an experimental geography-registration tool only.
# It is NOT production Lantern City art. The generated vector/cartographic
# treatment was rejected because it reads as a styled street map with game
# objects pasted on top. It must never auto-run or auto-commit to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lantern-city-territory-mosaic-experimental
  cancel-in-progress: true

jobs:
  build-and-verify-experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image pipeline dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Install Chromium for experimental browser QA
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply experimental renderer patches
        run: |
          node scripts/apply-lantern-art-target-patch.mjs
          node scripts/apply-lantern-territory-mosaic-patch.mjs
          node scripts/apply-lantern-capture-qa-patch.mjs

      - name: Export authoritative territory geometry
        run: pnpm goldline:territory-art:export

      - name: Build experimental vector registration render
        run: node scripts/render-lantern-city-vector-master.mjs

      - name: Production build compatibility check
        run: pnpm build

      - name: Capture experimental QA only
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 > /tmp/lantern-vite.log 2>&1 &
          VITE_PID=$!
          cleanup() { kill "$VITE_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:5173/growth/lantern-city >/dev/null; then
              node scripts/capture-lantern-city.mjs
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lantern-vite.log
          exit 1

      # Intentionally no git commit/push step. A human-approved authored-art
      # integration is required before any future territory renderer may ship.
      - name: Confirm experiment cannot publish
        run: |
          echo "Experimental Lantern City render complete."
          echo "No generated files will be committed or pushed by this workflow."
