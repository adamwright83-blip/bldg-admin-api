name: Fast Goldline smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldline-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-contracts:
    name: fast-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goldline_proof
        ports:
          - 3399:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      DATABASE_URL: mysql://root:root@127.0.0.1:3399/goldline_proof
      # LEGACY DAYFORGE COMPATIBILITY: historical runtime env-var name; not current architecture.
      DAYFORGE_RELEASE_DB: "1"
      APP_SHARED_API_SECRET: goldline-proof-app-secret-000000000000000000
      JWT_SECRET: goldline-proof-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: goldline-proof-placeholder-not-used
      DRIVER_PASSWORD: pixel-driver-pass
      DRIVER_OPEN_ID: goldline-proof-driver
      ADMIN_PASSWORD: goldline-proof-admin-pass
      GOLDLINE_PROOF_MODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm check
      - name: Enforce Phase 0 architecture guards
        run: |
          pnpm check:nomenclature
          pnpm check:tenant-ratchet
          pnpm check:vertical-dependencies
      - name: Prove Gate A platform authority boundary
        run: >-
          pnpm vitest run
          server/_core/platformAuthority.test.ts
          server/goldlineOnboarding/demoAccess.test.ts
          server/joystick/tenantIdentity.test.ts
          server/persistentOperator/identity.test.ts

      - name: Prove Authority Receipt contracts
        run: >-
          pnpm vitest run
          server/authority/authorityReceipt.test.ts
          server/authority/paymentAdmission.test.ts
          server/cleancloudPaidEvidence.test.ts
          server/cleancloudExternalEvidenceArchitecture.test.ts
          server/paymentAdmissionFailure.integration.test.ts
          server/authority/authoritySliceContract.test.ts
          server/authority/authorityPersistentOutcomeContract.test.ts
          shared/goldlineWorld.authority.test.ts
      - name: Prove Action / Execution authority convergence
        run: >-
          pnpm vitest run
          server/agents/agentRuntime.test.ts
          server/agents/residentAgentTools.test.ts
          server/residentOrderIdempotencyAuthority.test.ts
          server/agents/tools/updateResidentAgentPlanTool.test.ts
          server/agents/tools/updateOrderStatusTool.test.ts
          server/orders/orderOwnership.test.ts
          server/orders/orderOwnershipArchitecture.test.ts
          server/orders/orderOwnershipRouter.test.ts
          server/orders/orderLifecycle.test.ts
          server/agents/tools/dryCleaningActionAuthority.test.ts
          server/agents/tools/exportVendorDataTool.test.ts
          server/agents/tools/sendOperatorArtifactTool.test.ts
          server/claire/brain/tests/authority.test.ts
          server/claire/brain/tests/persistentOperatorAuthority.test.ts
          server/operatorArtifact/sendOperatorArtifact.test.ts
          server/persistentOperator/operationReceipt.test.ts
          server/persistentOperator/operatorAppointmentExecution.test.ts

      - name: Prove Claire domain-port convergence
        run: >-
          pnpm vitest run
          server/claire/domainPortArchitecture.test.ts
          server/claire/domainPortAvailability.test.ts
          server/claire/knowledge/accountActions.domainPort.test.ts
          server/claire/proactive/boardService.test.ts
          server/persistentOperator/obligationStore.boardPort.test.ts
          server/persistentOperator/operatorDoctrineStore.test.ts
          server/claire/brain/tests/grantBoundLegacyAdapter.test.ts
          server/claire/brain/tests/liveCutover.test.ts
          server/claire/identityTruth.test.ts
          server/claire/claireTwilio.test.ts
          server/claire/macroGoalService.test.ts
          server/claire/workdayPlanService.test.ts
          server/claire/workdayRecurrenceService.test.ts
          server/claire/weeklyMission/dossier.test.ts

      - name: Prove Daphne causal adaptation kernel
        run: >-
          pnpm vitest run
          server/daphne
          server/narratorOs/daphneRelationshipContext.test.ts
          server/operatorRepresentative/adaptation.test.ts
          server/operatorRepresentative/adaptationReceipts.test.ts
          server/claire/turn/daphneAdaptation.test.ts
          server/operatorRepresentative/readModel.test.ts
          server/operatorRepresentative/talk.test.ts
          server/claire/operatorAdaptationContext.test.ts

      - name: Prove commercial paid-revenue authority shadow
        run: >-
          pnpm vitest run
          server/commercialPipeline/commercialRevenueAuthorityShadow.test.ts
          server/commercialPipeline/commercialPipelineContract.test.ts
          server/commercialPipeline/commercialLifecycleAuthority.test.ts
          server/commercialMissions/commercialWalkInService.test.ts
          server/commercialMissions/commercialWalkInService.integration.test.ts
      - name: Prove read-only commercial payment mismatch report
        run: >-
          pnpm vitest run
          server/commercialPipeline/commercialPaymentAuthorityReport.test.ts

      - name: Prove churn and recovery planning-input truth
        run: >-
          pnpm vitest run
          server/churnRadar/authoritativeHistory.test.ts
          server/churnRadar/customerChurnContract.test.ts
          shared/customerChurn.test.ts

      - name: Prove Planning authority convergence
        run: >-
          pnpm vitest run
          server/missionDirector/rankableWork.test.ts
          server/missionDirector/missionDirectorService.test.ts
          server/missionDirector/planSelection.test.ts
          server/missionDirector/missionRank.test.ts
          server/missionDirector/pocketDetection.test.ts
          server/weeklyGrowthCandidates/weeklyGrowthCandidates.test.ts
          server/persistentOperator/decisionEngine.test.ts
          server/goldline/dayline/currentDayLineService.test.ts
          server/goldline/dayline/candidateCompletionLineage.test.ts

      - name: Prove Persistent Growth Operator Phase 0 contracts
        run: >-
          pnpm vitest run
          server/strategy/verticalTemplates/registry.test.ts
          server/saas/tenantSourceAdapters.test.ts
          server/saas/tenantImportService.test.ts
          server/analytics/canonicalRevenue.test.ts
          server/analytics/paidOrderLedger.test.ts
          server/analytics/paymentAuthorityAdmission.test.ts
          server/cleancloudPaidOrders.test.ts
          server/cleancloudBrowserSync/worldOutbox.economic.test.ts
          server/analytics/sourceCoverage.test.ts
          server/executionIntelligence/selectExecutionIntelligence.test.ts
          server/armory/armoryJ0.test.ts
          shared/tenantLearningGovernance.test.ts
          server/persistentOperator/tenantScope.test.ts
          server/persistentOperator/phase0SchemaContract.test.ts
          server/persistentOperator/identity.test.ts
          server/persistentOperator/observability.test.ts
          server/persistentOperator/identitySchemaContract.test.ts
          server/operatorRepresentative/readModel.test.ts
          server/operatorRepresentative/talk.test.ts
          server/claire/operatorAdaptationContext.test.ts
          server/campaignRuns/canonicalOwnership.test.ts
          server/lanternCity/lanternCityRouter.test.ts
          shared/lanternCityObjectiveMarks.test.ts
      - name: Prove Mitch native producer contracts
        run: >-
          pnpm vitest run
          server/mitch/mitchModel.test.ts
          server/mitch/mitchDispatcher.test.ts
          server/mitch/mitchQaAndReasoning.test.ts
          server/mitch/githubProducerBus.test.ts
          server/mitch/mitchNativeProducer.test.ts

      - name: Prove exact property Google Places targeting
        run: >-
          pnpm vitest run
          server/territory/googlePlacesTerritoryProvider.test.ts
          server/commercialMissions/commercialMissionTargetResolution.test.ts
      - name: Prove production migration path against a genuinely clean database
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3399/goldline_migrate_check
        run: |
          node -e "
            const mysql = require('mysql2/promise');
            (async () => {
              const conn = await mysql.createConnection('mysql://root:root@127.0.0.1:3399/');
              await conn.query('CREATE DATABASE IF NOT EXISTS goldline_migrate_check');
              await conn.end();
            })().catch(err => { console.error(err); process.exit(1); });
          "
          node scripts/migrate.mjs
          node scripts/migrate.mjs
      - name: Prove Daphne causal chain through authenticated production entrypoints
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3399/goldline_migrate_check
        run: >-
          pnpm vitest run --config vitest.integration.config.ts
          server/operatorRepresentative/daphneStage3b.mysql.integration.test.ts

      - name: Prove Mitch producer durability against clean MySQL
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3399/goldline_migrate_check
        run: >-
          pnpm vitest run --config vitest.integration.config.ts
          server/mitch/mitchStore.mysql.integration.test.ts

      - name: Prove campaign and behavioral truth invariants
        run: >-
          pnpm vitest run
          shared/goldlineCampaign.test.ts
          shared/goldlineCampaignReviewFixes.test.ts
          server/behavioralLedger/behavioralLedger.test.ts
          server/opsTasks.behavioralLedger.test.ts
          shared/behavioralFictionSelection.test.ts
          server/behavioralSelection/selectPreferredFiction.test.ts
          client/src/game/fiction/fictionDirector.test.ts
          shared/spiritHumanRescue.test.ts
          shared/spiritHumanPressure.test.ts
          server/spiritHumanRescue/rescueMissionService.test.ts
          server/spiritHumanRescue/consequenceReconciliation.test.ts
          server/spiritHumanRescue/inboundSmsRoute.test.ts
          server/_core/sms.test.ts
          client/src/game/fiction/SpiritHumanRescueMission.test.ts
          shared/behavioralExperimentPolicy.test.ts
          server/behavioralExperiment/assignPresentation.test.ts
      - name: Prove ops task completion concurrency against real MySQL
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3399/goldline_migrate_check
        run: >-
          pnpm vitest run --config vitest.integration.config.ts
          server/opsTasks.mysql.integration.test.ts
          server/strategy/snapshotLiveDerived.integration.test.ts
          server/behavioralExperiment/assignPresentation.mysql.integration.test.ts
          server/spiritHumanRescue/rescueMissionStore.mysql.integration.test.ts
          server/cleancloudBrowserSync/gumballCustomerTruth.mysql.integration.test.ts
      - name: Prove StrategyEngine live snapshot sections
        run: >-
          pnpm vitest run
          server/strategy/snapshotDormantCustomers.test.ts
          server/strategy/snapshotRepeatPipeline.test.ts
          server/strategy/slice2LiveSnapshot.test.ts
          server/strategy/slice04StrategySnapshot.test.ts
          server/strategy/snapshotCustomerAggregateLoad.test.ts
          server/claire/slice03AssertionGuardWiring.test.ts
          server/claire/slice01SafetyBaseline.test.ts
          server/claire/operatingTruthGuards.test.ts
          server/claire/weeklyMission/conversationalIntelligenceRepair.test.ts
          server/claire/claireOperatorPhone.test.ts
          server/claire/businessConversation.test.ts
          shared/claireRelationshipHistory.test.ts
          server/claire/slice06RelationshipHistory.test.ts
      - name: Prove Real Workday truth invariants
        run: >-
          pnpm vitest run
          shared/goldlineTemporal.test.ts
          shared/goldlineFuturePressure.test.ts
          server/goldlineWorld/futurePressureService.test.ts
          server/field/fieldOpportunityService.test.ts
          server/field/fieldTodayService.test.ts
      - name: Prove Claire pre-visit sales loadout
        run: >-
          pnpm vitest run
          server/missionSalesBrief/clairePreVisitIntel.test.ts
          server/missionSalesBrief/preVisitIntelAuthorization.test.ts
          client/src/game/actions/actionSurface.test.ts
          client/src/pages/commercialSalesMissionClaireIntel.test.ts

      - name: Prove Rook CONTACT authority boundary
        run: >-
          pnpm vitest run
          server/goldlineProgression/rookContactGrant.test.ts
          server/rookContact/rookContactAuthorityRepair.test.ts
          client/src/pages/goldline/wayward/waywardTruth.test.ts


  claire-conversation-contracts:
    name: claire-conversation-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove Claire semantic routing and structured referents
        run: >-
          pnpm vitest run
          server/claire/weeklyMission/conversationalIntelligenceRepair.test.ts
          server/claire/turn/decisionRecord.test.ts
          server/claire/turn/decisionRecordLive.test.ts
          server/claire/voice/conversationRelayAuthoritative.test.ts

  linked-debrief-contracts:
    name: linked-debrief-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove mission-linked tower debrief
        run: >-
          pnpm vitest run
          shared/missionLinkedDebrief.test.ts
          server/commercialMissions/missionLinkedDebriefContract.test.ts
          server/commercialMissions/driverSalesJournalResilience.test.ts
          server/commercialMissions/parkingLotDebriefContract.test.ts
          client/src/components/driver/SalesMomentum.test.ts

  fast-browser:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast-smoke-world
            command: >-
              pnpm exec playwright test --config playwright.goldline-smoke.config.ts
              e2e/goldline-smoke/worldSmoke.spec.ts
              e2e/goldline-smoke/lanternCityMount.spec.ts
              e2e/goldline-smoke/operatorRepresentative.spec.ts
          - name: fast-smoke-territories
            command: >-
              pnpm exec playwright test --config playwright.goldline-smoke.config.ts
              e2e/goldline-smoke/territoriesSmoke.spec.ts
          - name: fast-smoke-campaign
            command: >-
              pnpm exec playwright test --config playwright.goldline-smoke.config.ts
              e2e/goldline-smoke/campaignSmoke.spec.ts
              e2e/goldline-smoke/campaignMutation.spec.ts
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goldline_proof
        ports:
          - 3399:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      DATABASE_URL: mysql://root:root@127.0.0.1:3399/goldline_proof
      DAYFORGE_RELEASE_DB: "1"
      APP_SHARED_API_SECRET: goldline-proof-app-secret-000000000000000000
      JWT_SECRET: goldline-proof-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: goldline-proof-placeholder-not-used
      DRIVER_PASSWORD: pixel-driver-pass
      DRIVER_OPEN_ID: goldline-proof-driver
      ADMIN_PASSWORD: goldline-proof-admin-pass
      GOLDLINE_PROOF_MODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare deterministic proof world
        run: |
          pnpm db:legacy-dayforge:release
          pnpm tsx scripts/goldline-living-world-proof-seed.ts
      - name: Build the production application
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start deterministic proof server
        run: |
          scripts/goldline-proof-server.sh > /tmp/goldline-fast-smoke.log 2>&1 &
          echo $! > /tmp/goldline-fast-smoke.pid
          for _ in $(seq 1 45); do
            curl -sf -o /dev/null http://127.0.0.1:4177/driver && exit 0
            sleep 2
          done
          cat /tmp/goldline-fast-smoke.log
          exit 1
      - name: Run deterministic micro gate
        run: ${{ matrix.command }}
      - name: Upload Operator Representative visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-representative-v1-qa-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/operator-representative-v1-qa
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop proof server
        if: always()
        run: |
          if [ -f /tmp/goldline-fast-smoke.pid ]; then kill "$(cat /tmp/goldline-fast-smoke.pid)" 2>/dev/null || true; fi
