name: Fast Goldline smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goldline-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-contracts:
    name: fast-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goldline_proof
        ports:
          - 3399:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      DATABASE_URL: mysql://root:root@127.0.0.1:3399/goldline_proof
      # LEGACY DAYFORGE COMPATIBILITY: historical runtime env-var name; not current architecture.
      DAYFORGE_RELEASE_DB: "1"
      APP_SHARED_API_SECRET: goldline-proof-app-secret-000000000000000000
      JWT_SECRET: goldline-proof-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: goldline-proof-placeholder-not-used
      DRIVER_PASSWORD: pixel-driver-pass
      DRIVER_OPEN_ID: goldline-proof-driver
      ADMIN_PASSWORD: goldline-proof-admin-pass
      GOLDLINE_PROOF_MODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm check
      - name: Prove exact property Google Places targeting
        run: >-
          pnpm vitest run
          server/territory/googlePlacesTerritoryProvider.test.ts
          server/commercialMissions/commercialMissionTargetResolution.test.ts
      - name: Prove production migration path against a genuinely clean database
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3399/goldline_migrate_check
        run: |
          node -e "
            const mysql = require('mysql2/promise');
            (async () => {
              const conn = await mysql.createConnection('mysql://root:root@127.0.0.1:3399/');
              await conn.query('CREATE DATABASE IF NOT EXISTS goldline_migrate_check');
              await conn.end();
            })().catch(err => { console.error(err); process.exit(1); });
          "
          node scripts/migrate.mjs
          node scripts/migrate.mjs
      - name: Prove campaign and behavioral truth invariants
        run: >-
          pnpm vitest run
          shared/goldlineCampaign.test.ts
          shared/goldlineCampaignReviewFixes.test.ts
          server/behavioralLedger/behavioralLedger.test.ts
          server/opsTasks.behavioralLedger.test.ts
          shared/behavioralFictionSelection.test.ts
          server/behavioralSelection/selectPreferredFiction.test.ts
          client/src/game/fiction/fictionDirector.test.ts
          shared/spiritHumanRescue.test.ts
          shared/spiritHumanPressure.test.ts
          server/spiritHumanRescue/rescueMissionService.test.ts
          server/spiritHumanRescue/consequenceReconciliation.test.ts
          server/spiritHumanRescue/inboundSmsRoute.test.ts
          server/_core/sms.test.ts
          client/src/game/fiction/SpiritHumanRescueMission.test.ts
          shared/behavioralExperimentPolicy.test.ts
          server/behavioralExperiment/assignPresentation.test.ts
      - name: Prove ops task completion concurrency against real MySQL
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3399/goldline_migrate_check
        run: >-
          pnpm vitest run --config vitest.integration.config.ts
          server/opsTasks.mysql.integration.test.ts
          server/strategy/snapshotLiveDerived.integration.test.ts
          server/behavioralExperiment/assignPresentation.mysql.integration.test.ts
          server/spiritHumanRescue/rescueMissionStore.mysql.integration.test.ts
          server/cleancloudBrowserSync/gumballCustomerTruth.mysql.integration.test.ts
      - name: Prove StrategyEngine live snapshot sections
        run: >-
          pnpm vitest run
          server/strategy/snapshotDormantCustomers.test.ts
          server/strategy/snapshotRepeatPipeline.test.ts
          server/strategy/slice2LiveSnapshot.test.ts
          server/strategy/slice04StrategySnapshot.test.ts
          server/strategy/snapshotCustomerAggregateLoad.test.ts
          server/claire/slice03AssertionGuardWiring.test.ts
          server/claire/slice01SafetyBaseline.test.ts
          server/claire/operatingTruthGuards.test.ts
          server/claire/claireOperatorPhone.test.ts
          server/claire/businessConversation.test.ts
          shared/claireRelationshipHistory.test.ts
          server/claire/slice06RelationshipHistory.test.ts
      - name: Prove Real Workday truth invariants
        run: >-
          pnpm vitest run
          shared/goldlineTemporal.test.ts
          shared/goldlineFuturePressure.test.ts
          server/goldlineWorld/futurePressureService.test.ts
          server/field/fieldOpportunityService.test.ts
          server/field/fieldTodayService.test.ts
      - name: Prove Claire pre-visit sales loadout
        run: >-
          pnpm vitest run
          server/missionSalesBrief/clairePreVisitIntel.test.ts
          client/src/game/actions/actionSurface.test.ts

      - name: Prove Rook CONTACT authority boundary
        run: >-
          pnpm vitest run
          server/goldlineProgression/rookContactGrant.test.ts
          server/rookContact/rookContactAuthorityRepair.test.ts
          client/src/pages/goldline/wayward/waywardTruth.test.ts

  fast-browser:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast-smoke-world
            command: >-
              pnpm exec playwright test --config playwright.goldline-smoke.config.ts
              e2e/goldline-smoke/worldSmoke.spec.ts
              e2e/goldline-smoke/lanternCityMount.spec.ts
          - name: fast-smoke-territories
            command: >-
              pnpm exec playwright test --config playwright.goldline-smoke.config.ts
              e2e/goldline-smoke/territoriesSmoke.spec.ts
          - name: fast-smoke-campaign
            command: >-
              pnpm exec playwright test --config playwright.goldline-smoke.config.ts
              e2e/goldline-smoke/campaignSmoke.spec.ts
              e2e/goldline-smoke/campaignMutation.spec.ts
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goldline_proof
        ports:
          - 3399:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      DATABASE_URL: mysql://root:root@127.0.0.1:3399/goldline_proof
      DAYFORGE_RELEASE_DB: "1"
      APP_SHARED_API_SECRET: goldline-proof-app-secret-000000000000000000
      JWT_SECRET: goldline-proof-jwt-secret-000000000000000000
      STRIPE_SECRET_KEY: goldline-proof-placeholder-not-used
      DRIVER_PASSWORD: pixel-driver-pass
      DRIVER_OPEN_ID: goldline-proof-driver
      ADMIN_PASSWORD: goldline-proof-admin-pass
      GOLDLINE_PROOF_MODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare deterministic proof world
        run: |
          pnpm db:legacy-dayforge:release
          pnpm tsx scripts/goldline-living-world-proof-seed.ts
      - name: Build the production application
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start deterministic proof server
        run: |
          scripts/goldline-proof-server.sh > /tmp/goldline-fast-smoke.log 2>&1 &
          echo $! > /tmp/goldline-fast-smoke.pid
          for _ in $(seq 1 45); do
            curl -sf -o /dev/null http://127.0.0.1:4177/driver && exit 0
            sleep 2
          done
          cat /tmp/goldline-fast-smoke.log
          exit 1
      - name: Run deterministic micro gate
        run: ${{ matrix.command }}
      - name: Stop proof server
        if: always()
        run: |
          if [ -f /tmp/goldline-fast-smoke.pid ]; then kill "$(cat /tmp/goldline-fast-smoke.pid)" 2>/dev/null || true; fi
