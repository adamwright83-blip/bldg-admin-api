name: Architecture hostile inventory

on:
  pull_request:
    paths:
      - "server/architectureHostileInventory.audit.test.ts"
      - ".github/workflows/architecture-hostile-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Trace suspicious reader usage
        run: |
          rg -n --glob '!**/*.test.*' --glob '!**/*.spec.*' --glob '!**/archive/**'             'getOrderStats|getOpenOrderStats|getDataCompleteness|loadLedgerSourceEvidence|projectCustomerAssets|getLevel4GateState|listAdminCustomerAggregates|listPaidOrdersForBuildingRevenue|loadDataFreshness|getRevenueInterventionCandidates|sendPaymentReminderForOrder|logRecentFirstOrderWins'             server shared client/src || true
      - name: Emit hostile architecture inventory
        run: pnpm vitest run server/architectureHostileInventory.audit.test.ts
