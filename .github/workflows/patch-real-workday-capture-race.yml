name: One-shot Real Workday capture race patch

on:
  push:
    branches:
      - cursor/goldline-real-workday

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/goldline-real-workday
          fetch-depth: 0
      - name: Patch synchronous arrived-stop handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/game/GoldlineGameHome.tsx')
          text = path.read_text()
          old = '''            onLogSignal={
              activeExpedition?.kind === "local_target_run" &&
              !localTargetRealArrivalConfirmed
                ? props.onOpenJournal
                : props.onOpenLogSignal
            }
          '''
          new = '''            onLogSignal={
              activeExpedition?.kind === "local_target_run" &&
              !localTargetRealArrivalConfirmed
                ? props.onOpenJournal
                : arrivedStop
                  ? () => {
                      // Carry the already-confirmed doorstep identity into the
                      // controller synchronously before opening capture. The
                      // passive reporting effect below remains useful for the
                      // general operating bar, but this real-action boundary
                      // must not depend on a later React effect/render.
                      props.onOperatorStopChange?.(arrivedStop);
                      props.onOpenLogSignal?.();
                    }
                  : props.onOpenLogSignal
            }
          '''
          if old not in text:
              raise SystemExit('expected onLogSignal block not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/patch-real-workday-capture-race.yml
      - name: Commit exact patch
        run: |
          git config user.name 'goldline-ci-patcher'
          git config user.email 'goldline-ci-patcher@users.noreply.github.com'
          git add client/src/game/GoldlineGameHome.tsx .github/workflows/patch-real-workday-capture-race.yml
          git commit -m 'fix(real-workday): carry confirmed stop into capture click'
          git push origin HEAD:cursor/goldline-real-workday
